<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 데스크 · 보고용 시연 2</title>
<style>
:root{color-scheme:light;font:16px/1.55 "Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--ivory)}
[data-theme]{color-scheme:light;--heading:var(--navy);--nav-text:var(--ivory);--action-ink:var(--navy);--field:color-mix(in srgb,var(--paper),white 55%);--weekend:color-mix(in srgb,var(--navy),#57729b 45%)}
:root,[data-theme="gold"]{--navy:#0d1f37;--ivory:#f1eee5;--gold:#b3915d;--ink:#2d2d2d;--muted:#626773;--line:#c5c3bc;--paper:#fbf9f3;--subaccent:#d6d9df;--accent-ink:#80602b;--tint:#f1e6ce;--selected:#e8cea0}
[data-theme="sage"]{--navy:#213a32;--ivory:#f3f0e7;--gold:#94aa92;--ink:#24322a;--muted:#535f57;--line:#bfc7b9;--paper:#faf8f0;--subaccent:#d8c9b1;--accent-ink:#3e6249;--tint:#e4ecdf;--selected:#c5d6be}
[data-theme="blue"]{--navy:#293647;--ivory:#f1f3f4;--gold:#91aec8;--ink:#263443;--muted:#536171;--line:#bcc6cf;--paper:#fbfcfd;--subaccent:#c7d0da;--accent-ink:#3c5877;--tint:#e4edf5;--selected:#c8d9eb}
[data-theme="mauve"]{--navy:#443347;--ivory:#f5eff0;--gold:#c39fac;--ink:#372e37;--muted:#625463;--line:#cdbfc6;--paper:#fdf8f9;--subaccent:#d7cdd5;--accent-ink:#714759;--tint:#f2e2e8;--selected:#e8c9d5}
[data-theme="neon"]{color-scheme:dark;--navy:#101624;--ivory:#101624;--gold:#c5fb62;--ink:#f1f5fa;--muted:#b1becf;--line:#42546a;--paper:#182335;--subaccent:#bda7ff;--accent-ink:#4de8ff;--tint:#27384c;--selected:#4de8ff;--heading:#f1f5fa;--nav-text:#f1f5fa;--field:#1d2b40;--weekend:#9dbcf5}
[data-theme="coral"]{--navy:#3c2428;--ivory:#fff2e9;--gold:#f2927c;--ink:#392729;--muted:#695455;--line:#d8bcb2;--paper:#fff8f3;--subaccent:#f4c488;--accent-ink:#963d35;--tint:#fde3d9;--selected:#f6ae9d}
[data-theme="paper"]{--navy:#2b2927;--ivory:#f5f0df;--gold:#803c43;--ink:#302b27;--muted:#62584e;--line:#b9aa93;--paper:#fbf7e9;--subaccent:#e2d1b6;--accent-ink:#803c43;--tint:#efe2d0;--selected:#e4b8bb;--action-ink:#fff8ef}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:226px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:.45rem .8rem}
button:hover{filter:brightness(.96)}
:focus-visible{outline:3px solid #80602b;outline-offset:3px}
.sidebar{background:var(--navy);color:var(--ivory);padding:26px 14px;position:sticky;top:0;height:100vh}
.brand{font-size:1.23rem;font-weight:800;padding:0 10px;margin-bottom:26px}
.brand-icon{color:#d5b580;margin-right:.35rem}
nav{display:grid;gap:6px}
nav button{text-align:left;color:inherit;background:none;border:0;border-inline-start:4px solid transparent;border-radius:6px;padding:.65rem .8rem}
nav button span{display:inline-block;width:1.35rem}
nav button[aria-current=page]{border-inline-start-color:var(--gold);background:#28394d;font-weight:700}
main{width:100%;max-width:1450px;padding:clamp(18px,3.5vw,52px);margin-inline:auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--navy)}
h1{font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.07em}
h2{font-size:1.2rem}
.sub,.muted,small{color:var(--muted)}
header,.between,.actions,.filter{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{margin-bottom:24px}
.primary{background:var(--gold);color:#101c2c;border-color:#a78550;font-weight:800}
.dash{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.55fr);gap:18px;align-items:start}
.dashboard-tasks{display:grid;gap:14px;grid-template-rows:auto minmax(0,1.15fr) minmax(0,1fr);
  height:max(440px,calc(100dvh - 2 * clamp(18px,3.5vw,52px)));min-width:0}
.dashboard-tasks[data-focused-list="tasks"]{grid-template-rows:auto minmax(0,1fr) auto}
.dashboard-tasks[data-focused-list="routines"]{grid-template-rows:auto auto minmax(0,1fr)}
.dashboard-heading{margin-bottom:0}
.dashboard-heading-button{padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left}
.dashboard-list{display:flex;flex-direction:column;min-height:0}
.dashboard-list-header{flex:none}
.dashboard-list-header h2{font-size:1.2rem;letter-spacing:normal}
.dashboard-list-header [hidden],.dashboard-list-scroll[hidden]{display:none}
.list-heading{display:inline-flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:inherit;font-weight:800}
.list-heading span{color:var(--accent-ink)}
.dashboard-list-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:0 4px 1px 0}
.dashboard-calendar{min-width:0}
.dashboard-notes h2 span{display:inline-block;margin-left:5px;color:var(--muted);font-size:.86rem;font-weight:600}
.dashboard-notes .compact-note{padding:7px 0}
.dashboard-notes .compact-note summary{list-style:none;display:flex;align-items:baseline;gap:8px;font-weight:600}
.dashboard-notes .compact-note summary::-webkit-details-marker{display:none}
.dashboard-notes .compact-note summary::before{content:"•";color:var(--accent-ink);flex:none}
.dashboard-notes .compact-note[open] summary::before{content:"⌄"}
.stack{display:grid;gap:18px}
.panel{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:18px;min-width:0}
.rows{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #dedbd1}
.row:last-child{border-bottom:0}
.row div,.row label{flex:1;min-width:0;overflow-wrap:anywhere}
.row input{inline-size:20px;block-size:20px;accent-color:var(--navy);flex:none}
.row strong,.row small{display:block}
.done strong{text-decoration:line-through;color:var(--muted)}
.quiet{background:none;border:0;padding:.35rem .5rem}
.empty{padding:14px 0;color:var(--muted)}
.calendar-panel{padding:14px}
.calendar-panel h2,.week,.event-title,.period-bar{font-family:"나눔스퀘어라운드","NanumSquareRound","Malgun Gothic",sans-serif}
.calendar-panel h2{font-size:1.3rem;letter-spacing:-.03em}
.calendar-actions{display:flex;gap:5px;flex-wrap:wrap}
.calendar-scroll{overflow-x:auto;margin-top:12px}
.week,.calendar-week,.period-lanes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week,.calendar-grid{min-width:540px}
.week{text-align:center;padding:7px 0;color:var(--navy);font-size:.95rem;background:#e7e3d9;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;font-weight:800}
.week span:first-child{color:#805619}
.week span:last-child{color:#3f5878}
.calendar-grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.calendar-week{position:relative}
.day-blank,.day-cell{min-height:72px;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.day-cell{border-radius:0;min-width:0;background:transparent;text-align:left;align-content:start;padding:5px 6px;display:grid;gap:3px;user-select:none}
.day-cell.next-month-day{background:#f1efe8}
.next-month-day .day-number{color:#6e6d68}
.calendar-week .day-cell:first-child:not(.next-month-day){background:#f7f2e7}
.calendar-week .day-cell:nth-child(7):not(.next-month-day){background:#edf0f3}
.calendar-week .day-cell:first-child:not(.next-month-day) .day-number{color:#805619}
.calendar-week .day-cell:nth-child(7):not(.next-month-day) .day-number{color:#3f5878}
.calendar-week .day-cell[aria-pressed=true] .day-number{background:#e8cea0;color:var(--navy)}
.day-cell.range-preview{background:#e7d3ac}
.calendar-week .day-cell.range-preview:nth-child(n){background:#e7d3ac}
.day-entries{display:grid;gap:4px;margin-top:var(--period-space,0px);min-width:0}
.period-lanes{position:absolute;top:31px;inset-inline:0;grid-auto-rows:20px;pointer-events:none}
.period-bar{margin:1px 4px;min-width:0;padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:0;border-radius:9px;background:#e3c998;color:var(--navy);font-size:.76rem;font-weight:700;text-align:left;pointer-events:auto}
.period-bar:nth-child(even){background:#d6d9df}
.day-number{display:grid;place-items:center;justify-self:start;width:24px;height:24px;border-radius:50%;
  font:800 1rem/1 "Arial Rounded MT Bold","Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:var(--navy)}
.event{display:grid;gap:2px;overflow-wrap:anywhere;font-size:.78rem;line-height:1.4}
.event-title{position:relative;border-radius:8px;background:#f1e6ce;color:var(--navy);padding:2px 5px 2px 14px;font-weight:700}
.event-title::before{content:"";position:absolute;top:.67em;left:5px;width:5px;height:5px;border-radius:50%;background:#98702f}
.event-memo{color:#494640;padding-inline-start:6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:pre-line}
.memo-text{white-space:pre-wrap;overflow-wrap:anywhere}
.note-filters{align-items:end;margin:10px 0 4px}
.note-filters label{display:grid;gap:3px;min-width:0;font-size:.875rem}
.note-search{flex:1 1 165px}
.note-month{flex:0 1 135px}
.note-row{padding:12px 0;border-bottom:1px solid #dedbd1}
.note-row:last-child{border-bottom:0}
.compact-note{padding:8px 0}
.compact-note summary{cursor:pointer;font-weight:650;overflow-wrap:anywhere}
.note-content{padding:10px 0 0 16px}
.note-row h3{font-size:1rem;overflow-wrap:anywhere}
.note-row p{margin:.35rem 0}
.note-carry,form .note-carry{display:flex;align-items:center;gap:5px;font-size:.875rem}
.note-carry input{accent-color:var(--navy)}
.short-memo{min-height:65px}
.date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.date-fields input{width:100%;min-width:0}
.task-grip{cursor:grab;color:var(--muted);flex:none;user-select:none;font-size:1.1rem}
.row .task-star{padding:.2rem .15rem;font-size:1.12rem;line-height:1;color:#5b5852;flex:none}
.row .task-star[aria-pressed=true]{color:#88632d}
.row-edit{display:grid;place-items:center;flex:none;width:27px;height:27px;padding:0;color:var(--muted)}
.row-edit:hover,.row-edit:focus-visible{background:var(--tint);color:var(--accent-ink)}
.group-actions{display:flex;align-items:center;gap:7px}
.group-actions button,.task-group .quiet{font-size:.85rem}
.task-group{padding:8px 0;border-bottom:1px solid #dedbd1}
.task-group>.between strong{font-size:.8rem;padding:2px 7px;border-radius:5px;background:#f0dfba;color:var(--navy)}
.task-entry{border-bottom:1px solid #dedbd1}
.task-entry:last-child,.task-entry>.row{border-bottom:0}
.group-members>.task-entry{position:relative;padding-inline-start:13px}
.group-members>.task-entry::before{content:"";position:absolute;left:3px;top:0;bottom:-1px;width:2px;background:var(--gold)}
.group-members>.task-entry:first-child::before{top:24px}
.group-members>.task-entry:last-child::before{bottom:auto;height:24px}
.group-members>.task-entry:only-child::before{display:none}
.group-members>.task-entry::after{content:"";position:absolute;left:0;top:20px;width:8px;height:8px;background:var(--gold);border-radius:50%}
.task-expand{display:flex;align-items:baseline;gap:5px;text-align:left;padding:0;border:0;background:none;color:var(--navy);line-height:inherit}
.task-expand strong{min-width:0}
.task-expand span{flex:none}
.row small.checklist-count{display:inline-block;padding:0 6px;border-radius:9px;background:#f0dfba;color:var(--navy)}
.task-checklist{margin:0 0 10px 25px;padding-inline-start:10px;border-inline-start:2px solid var(--gold);min-width:0}
.checklist-item{display:flex;align-items:center;gap:4px;justify-content:space-between}
.checklist-item label{display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere;font-size:.9rem;cursor:pointer}
.checklist-item input{accent-color:var(--navy);flex:none}
.checklist-item.checked span{text-decoration:line-through;color:var(--muted)}
.checklist-add{margin-top:6px;padding:.2rem .5rem;font-size:.85rem}
.checklist-form{display:flex;gap:5px;margin-top:6px}
.checklist-form[hidden]{display:none}
.checklist-form input{min-width:0;flex:1}
.checklist-form button{flex:none}
.group-picker{display:grid;gap:8px;max-height:45vh;overflow:auto}
.group-picker label{display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.group-actions{flex-wrap:wrap}
.memo-preview{display:inline-block;position:relative}
.memo-trigger{padding:0 5px;font-size:.78rem;border-radius:4px;background:var(--tint);color:var(--accent-ink)}
.memo-tooltip{display:none;position:absolute;z-index:3;top:100%;left:0;width:max-content;max-width:min(250px,56vw);
  padding:8px 10px;border:1px solid var(--gold);border-radius:6px;background:var(--paper);color:var(--ink);
  box-shadow:0 3px 10px #0002;font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere}
.memo-preview:hover .memo-tooltip,.memo-preview:focus-within .memo-tooltip{display:block}
.dashboard-list-scroll .memo-tooltip{position:fixed;top:var(--memo-top,0px);left:var(--memo-left,0px);max-height:55vh;overflow:auto}
.trash-target{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);
  border-radius:7px;color:var(--navy);background:var(--paper)}
.trash-target.ready{outline:2px solid var(--gold);outline-offset:2px}
.trash-target.over{background:var(--gold)}
.filter{justify-content:flex-start;margin-bottom:14px}
input:not([type=checkbox]),select,textarea{border:1px solid #a6a39b;border-radius:6px;background:#fffdf8;padding:.5rem .6rem;max-width:100%}
dialog{border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);width:min(520px,calc(100% - 26px));padding:22px}
dialog::backdrop{background:#0d1f3788}
form{display:grid;gap:12px}
form label{display:grid;gap:4px;font-weight:650}
form label[hidden]{display:none}
textarea{min-height:150px;resize:vertical}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:.8rem 0}
#status:not(:empty){position:fixed;bottom:18px;right:18px;background:var(--navy);color:white;padding:10px 16px;border-radius:8px;z-index:2}
@media(max-width:1100px){body{grid-template-columns:175px minmax(0,1fr)}.dash{grid-template-columns:1fr}}
@media(max-width:600px){body{display:block}.sidebar{position:static;height:auto;padding:10px}.brand{margin-bottom:6px}nav{display:flex;flex-wrap:wrap}nav button{font-size:.875rem;padding:.35rem}}

.test-back{color:inherit;padding:8px 10px}
.test-entry{width:min(100%,640px);margin-bottom:22px;gap:8px}
.test-entry input{width:100%}
.quick-preview{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 8px}
.quick-preview[hidden]{display:none}
.quick-test .date-fields[hidden]{display:none}
.quick-preview strong{color:var(--navy);overflow-wrap:anywhere}
.test-buttons{display:flex;gap:6px;margin-left:auto}
.test-buttons button{padding:.25rem .65rem}
.test-columns{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.test-examples{display:grid;gap:8px;margin-top:12px}
.test-examples button{text-align:left}
@media(max-width:850px){.test-columns{grid-template-columns:1fr}}

:focus-visible{outline-color:var(--accent-ink)}
.brand-icon{color:var(--selected)}
nav button[aria-current=page]{background:color-mix(in srgb,var(--navy),var(--ivory) 13%)}
.primary{color:var(--navy);border-color:var(--gold)}
.row,.note-row,.task-group,.task-entry{border-bottom-color:color-mix(in srgb,var(--line),var(--paper) 48%)}
.week{background:color-mix(in srgb,var(--ivory),var(--line) 25%)}
.week span:first-child,.calendar-week .day-cell:first-child:not(.next-month-day) .day-number{color:var(--accent-ink)}
.week span:last-child,.calendar-week .day-cell:nth-child(7):not(.next-month-day) .day-number{color:color-mix(in srgb,var(--navy),#57729b 45%)}
.day-cell.next-month-day{background:var(--ivory)}
.next-month-day .day-number,.event-memo{color:var(--muted)}
.calendar-week .day-cell:first-child:not(.next-month-day){background:color-mix(in srgb,var(--paper),var(--tint) 36%)}
.calendar-week .day-cell:nth-child(7):not(.next-month-day){background:color-mix(in srgb,var(--paper),var(--subaccent) 32%)}
.calendar-week .day-cell[aria-pressed=true] .day-number{background:var(--selected)}
.calendar-week .day-cell.range-preview:nth-child(n){background:var(--selected)}
.period-bar{background:var(--selected)}
.period-bar:nth-child(even){background:var(--subaccent)}
.event-title,.task-group>.between strong,.row small.checklist-count{background:var(--tint)}
.event-title::before{background:var(--accent-ink)}
.row .task-star[aria-pressed=true]{color:var(--accent-ink)}
input:not([type=checkbox]),select,textarea{border-color:var(--line);background:color-mix(in srgb,var(--paper),white 55%)}
dialog::backdrop{background:color-mix(in srgb,var(--navy) 55%,transparent)}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:10px}
.theme-card{display:grid;grid-template-columns:minmax(0,1fr) auto 15px;align-items:center;gap:7px;
  padding:6px 8px;color:var(--ink);text-align:left;font-size:.88rem}
.theme-card[aria-pressed=true]{border-color:var(--accent-ink)}
.theme-card strong{color:var(--heading,var(--navy))}
.theme-selected{color:var(--accent-ink);font-weight:800;text-align:center}
.theme-swatches{display:flex;gap:4px}
.theme-swatches i{width:14px;height:12px;border-radius:3px;background:var(--navy);border:1px solid var(--line)}
.theme-swatches i:nth-child(2){background:var(--ivory)}
.theme-swatches i:nth-child(3){background:var(--gold)}
.theme-swatches i:nth-child(4){background:var(--subaccent)}
@media(max-width:520px){.theme-grid{grid-template-columns:1fr}}

.attachment-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-block:8px}
.attachment-card{display:grid;gap:4px;min-width:0}
.attachment-card [data-view-image]{height:95px;padding:4px;overflow:hidden}
.attachment-card img{width:100%;height:100%;object-fit:contain;display:block}
.attachment-card [data-remove-image]{justify-self:start;font-size:.8rem;padding:2px 6px}
[data-image-list]:empty,[data-image-status]:empty{display:none}
#image-viewer{width:min(1000px,calc(100% - 28px));max-height:94vh}
#image-viewer form{justify-content:end;margin-bottom:8px}
#image-viewer img{display:block;width:100%;max-height:76vh;object-fit:contain}

#chat-launch{position:fixed;right:18px;bottom:18px;z-index:4;width:51px;height:51px;display:grid;
  place-items:center;padding:0;border:2px solid var(--gold);border-radius:50%;background:var(--navy);color:var(--paper);box-shadow:0 3px 10px #0003}
#work-chat{position:fixed;right:18px;bottom:78px;z-index:4;width:min(430px,calc(100vw - 36px));
  height:min(500px,calc(100dvh - 100px));display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--paper);box-shadow:0 8px 25px #0003}
#work-chat[hidden]{display:none}
.chat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;background:var(--navy);color:var(--paper)}
.chat-top h2{color:inherit;font-size:1rem}
.chat-top button{background:transparent;color:inherit;border:0;padding:0 6px;font-size:1.25rem}
#chat-log{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:12px}
.chat-user,.chat-bot{padding:8px 11px;border-radius:9px;max-width:95%;overflow-wrap:anywhere}
.chat-user{align-self:flex-end;background:var(--tint)}
.chat-bot{align-self:flex-start;background:var(--ivory)}
.chat-results{display:grid;gap:5px;max-width:100%}
.chat-result{border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere}
.chat-result strong,.chat-result small{display:block}
.chat-buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chat-buttons button{font-size:.85rem;padding:.2rem .5rem}
#chat-form{display:flex;padding:8px;gap:6px;border-top:1px solid var(--line)}
#chat-input{flex:1;min-width:0}
#chat-form button{flex:none}

.sidebar{color:var(--nav-text,var(--ivory))}
h1,h2,h3,.week,.day-number,.event-title,.task-expand,.trash-target,
.task-group>.between strong,.row small.checklist-count,.quick-preview strong{color:var(--heading,var(--navy))}
.primary{color:var(--action-ink,var(--navy))}
input:not([type=checkbox]),select,textarea{background:var(--field,color-mix(in srgb,var(--paper),white 55%))}
.week span:last-child,.calendar-week .day-cell:nth-child(7):not(.next-month-day) .day-number{color:var(--weekend,color-mix(in srgb,var(--navy),#57729b 45%))}
:root[data-theme="neon"] nav button[aria-current=page]{background:var(--selected);color:var(--navy)}
:root[data-theme="neon"] input[type=checkbox]{accent-color:var(--gold)}
:root[data-theme="neon"] .day-cell[aria-pressed=true] .day-number,
:root[data-theme="neon"] .day-cell.range-preview .day-number,
:root[data-theme="neon"] .trash-target.over{color:var(--navy)}
:root[data-theme="neon"] .task-grip,:root[data-theme="neon"] .row .task-star[aria-pressed=false]{color:var(--muted)}
:root[data-theme="neon"] .chat-top{color:var(--nav-text)}
:root[data-theme="neon"] #chat-launch{background:var(--gold);color:var(--navy)}
:root[data-theme="paper"] h1,:root[data-theme="paper"] .calendar-panel h2{font-family:"Batang",serif}

/* demo-only:start */
.demo-toolbar{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px clamp(18px,3.5vw,52px);background:#e8e1d1;font-size:.875rem}
.demo-toolbar strong{color:var(--navy)}
.demo-toolbar button{padding:.22rem .55rem}
body{grid-template-rows:auto 1fr}.sidebar{grid-row:1/3}main{grid-column:2}
.demo-popup{position:fixed;z-index:3;bottom:18px;right:18px;width:min(350px,calc(100vw - 36px));border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:0 5px 20px #0d1f3740;border-bottom:4px solid var(--gold)}
.demo-popup[hidden]{display:none}
.demo-popup>div{background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;padding:6px 12px}
.demo-popup button{color:white;background:transparent;border:0;padding:0 8px}
.demo-popup strong,.demo-popup small{display:block;padding:0 14px;overflow-wrap:anywhere}
.demo-popup strong{padding-top:10px}.demo-popup small{padding-bottom:10px}
/* demo-only:end */
</style>

</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="brand-icon" aria-hidden="true">▤</span> 업무 데스크</div>
  <nav aria-label="업무 메뉴">
    <button data-page="today"><span aria-hidden="true">☑</span> 오늘 할 일</button>
    <button data-page="calendar"><span aria-hidden="true">▦</span> 월간 캘린더</button>
    <button data-page="templates"><span aria-hidden="true">▧</span> 업무 양식함</button>
    <button data-page="notes"><span aria-hidden="true">▤</span> 월간 메모</button>
    <button data-page="settings"><span aria-hidden="true">⚙</span> 설정</button>
  </nav>
</aside>
<section class="demo-toolbar" aria-label="시연 설정">
  <strong>보고용 시연 2</strong><span id="demo-clock"></span>
  <button type="button" id="demo-hour">+1시간</button>
  <button type="button" id="demo-day">다음 날</button>
  <button type="button" id="demo-alert" data-test>알림 미리보기</button>
  <button type="button" id="demo-reset">시연 초기화</button>
</section>
<main id="workspace"><p>업무를 불러오는 중입니다.</p></main>
<div id="status" role="status" aria-live="polite"></div>
<dialog id="editor"></dialog>
<dialog id="image-viewer" aria-label="첨부 이미지">
  <form method="dialog"><button aria-label="이미지 닫기">닫기</button></form>
  <img alt="">
</dialog>
<section id="work-chat" hidden aria-labelledby="work-chat-title">
  <div class="chat-top"><h2 id="work-chat-title">업무 챗봇</h2><button type="button" data-close-chat aria-label="챗봇 닫기">×</button></div>
  <div id="chat-log" role="log" aria-live="polite"><p class="chat-bot">“낼 오전 10시에 거래처 전화 추가해줘” 또는 “지난달 정산 메모 찾아줘”처럼 써보세요.</p></div>
  <form id="chat-form"><input id="chat-input" type="text" autocomplete="off" maxlength="500" aria-label="업무 챗봇 메시지" placeholder="할 일 추가하거나 메모·양식 찾기" required>
  <button type="submit" class="primary">보내기</button></form>
</section>
<button id="chat-launch" type="button" aria-label="업무 챗봇 열기" aria-controls="work-chat" aria-expanded="false">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.6-.7L4 21l1.5-4.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 11.5h.1m3.9 0h.1m3.9 0h.1" stroke-linecap="round"/></svg>
</button>
<aside id="demo-popup" class="demo-popup" role="status" hidden>
  <div><span>업무 데스크</span><button type="button" aria-label="알림 닫기">×</button></div>
  <strong></strong><small></small>
</aside>

    pen.fillStyle = "#b3915d";
    [140, 235, 185].forEach((width, index) => pen.fillRect(16, 63 + index * 28, width, 13));
    return {name:"가상 예시 이미지",src:canvas.toDataURL("image/webp")};

    const today = dayKey(0);

async function load() {
  const response = await demo.request("/api/state", {cache:"no-store"});
  if (!response.ok) throw new Error("load");
  ({data, revision} = await response.json());
  data.notes ??= [];
  render();
}

async function change(update, report = message) {
  if (saving) {
    report("저장이 끝난 뒤 다시 시도해 주세요.");
    return false;
  }
  saving = true;
  const next = structuredClone(data);
  update(next);
  for (const collection of [next.tasks, next.routines]) {
    const groupSizes = new Map();
    for (const item of collection) {
      if (item.groupId) groupSizes.set(item.groupId, (groupSizes.get(item.groupId) || 0) + 1);
    }
    for (const item of collection) {
      if (groupSizes.get(item.groupId) === 1) delete item.groupId;
    }
  }
  try {
    const body = JSON.stringify({data:next, revision});
    if (new TextEncoder().encode(body).length > 16 * 1024 * 1024) {
      report("저장 공간이 부족해요. 기존 첨부 이미지를 일부 삭제해 주세요.");
      return false;
    }
    const response = await demo.request("/api/state", {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body
    });
    if (response.status === 409) {
      await load();
      report("다른 탭에서 변경한 내용을 불러왔어요. 다시 시도해 주세요.");
      return false;
    }
    if (!response.ok) throw new Error("save");
    ({data, revision} = await response.json());
    data.notes ??= [];
    render();
    return true;
  } catch {
    render();
    report("저장하지 못했어요. 다시 시도해 주세요.");
    return false;
  } finally {
    saving = false;
  }
}

function monthlyOccurrence(year, month, dayOfMonth) {
  const monthEnd = new Date(year, month + 1, 0);
  if (dayOfMonth > monthEnd.getDate()) {
    while (!isWeekday(monthEnd)) monthEnd.setDate(monthEnd.getDate() - 1);
    return dateKey(monthEnd);
  }
  const date = new Date(year, month, dayOfMonth);
  while (!isWeekday(date)) date.setDate(date.getDate() + 1);
  return dateKey(date);
}

function latestOccurrence(item, day) {
  const date = parseDate(day);
  if (item.repeat === "monthly") {
    for (let offset = 0; offset < 3; offset++) {
      const occurrence = monthlyOccurrence(date.getFullYear(), date.getMonth() - offset, Number(item.dayOfMonth));
      if (occurrence >= item.start && occurrence <= day) return occurrence;
    }
    return null;
  }
  do {
    if (dateKey(date) < item.start) return null;
    if (isWeekday(date) && (item.repeat === "daily" || date.getDay() === Number(item.weekday))) {
      return dateKey(date);
    }
    date.setDate(date.getDate() - 1);
  } while (true);
}

function todayTasks() {
  return data.tasks.filter(item => {
    const due = item.date || item.created;
    return item.done ? item.completed === today :
      (taskStart(item) <= today && today <= due) ||
      (due < today && (data.weekends || isWeekday(parseDate(today))));
  }).sort((left, right) => Number(Boolean(left.done)) - Number(Boolean(right.done)) ||
    (left.date || left.created).localeCompare(right.date || right.created) ||
    (left.time || "07:30").localeCompare(right.time || "07:30"));
}

function editRowButton(type, item) {
  return `<button type="button" class="quiet row-edit" data-edit="${type}" data-id="${escapeHtml(item.id)}"
    title="수정" aria-label="${escapeHtml(item.title)} 수정">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m14.5 6.5 3 3M4 20l4.5-1 11-11a2.12 2.12 0 0 0-3-3l-11 11L4 20Z"/>
    </svg></button>`;
}

function taskRow(item, showStar = false) {
  const details = [];
  if (item.date) {
    const dates = isPeriod(item) ? shortDate(taskStart(item)) + " ~ " + shortDate(item.date) : shortDate(item.date);
    details.push((!item.done && item.date < today ? "기한 지남 · " : "") + dates);
    if (!item.done && item.date >= today) details.push(item.time ? item.time + " · 5분 전 알림" : "07:30 알림");
    else if (item.time) details.push(item.time);
  }
  const children = item.checklist || [];
  const expanded = showStar && expandedTasks.has(item.id);
  const title = showStar ? `<button type="button" class="task-expand" data-expand-task="${item.id}"
    aria-expanded="${expanded}" aria-controls="checklist-${item.id}"><strong>${escapeHtml(item.title)}</strong>
    <span aria-hidden="true">${expanded ? "⌄" : "›"}</span></button>
    ${children.length ? `<small class="checklist-count">${children.filter(child => child.done).length}/${children.length} 완료</small>` : ""}` :
    `<strong>${escapeHtml(item.title)}</strong>`;
  const row = `<div class="row ${item.done ? "done" : ""}">
    <span class="task-grip" draggable="true" data-drag-task="${item.id}" title="휴지통으로 끌어 삭제" aria-hidden="true">⠿</span>
    <input type="checkbox" data-check="tasks" data-id="${item.id}" aria-label="${escapeHtml(item.title)} 완료" ${item.done ? "checked" : ""}>
    <div>${title}${details.length ? `<small>${details.join(" · ")}</small>` : ""}
    ${item.memo ? (showStar ? `<span class="memo-preview">
      <button type="button" class="memo-trigger" aria-describedby="task-memo-${escapeHtml(item.id)}">메모</button>
      <span class="memo-tooltip" id="task-memo-${escapeHtml(item.id)}" role="tooltip">${escapeHtml(item.memo)}</span>
    </span>` : `<small class="memo-text">${escapeHtml(item.memo)}</small>`) : ""}</div>
    ${showStar ? `<button class="quiet task-star" data-star="${item.id}" aria-pressed="${Boolean(item.starredAt)}"
      aria-label="${escapeHtml(item.title)} 시간당 알림" title="미완료 상태에서 한 시간마다 알림">${item.starredAt ? "★" : "☆"}</button>` : ""}
    ${editRowButton("tasks", item)}
  </div>`;
  if (!showStar) return row;
  return `<article class="task-entry">${row}
    <div id="checklist-${item.id}" class="task-checklist" ${expanded ? "" : "hidden"}>
      ${children.map(child => `<div class="checklist-item ${child.done ? "checked" : ""}">
        <label><input type="checkbox" id="check-${child.id}" data-checklist-task="${item.id}" data-child="${child.id}"
          ${child.done ? "checked" : ""}> <span>${escapeHtml(child.title)}</span></label>
        <button type="button" class="quiet" data-remove-child="${child.id}" data-id="${item.id}"
          aria-label="${escapeHtml(child.title)} 삭제">×</button></div>`).join("")}
      <button type="button" class="checklist-add" data-add-child="${item.id}">+ 체크항목 추가</button>
      <form class="checklist-form" data-checklist-form="${item.id}" hidden>
        <input name="title" maxlength="120" aria-label="새 체크항목" placeholder="세부 작업 입력" required>
        <button type="submit">추가</button>
      </form>
    </div></article>`;
}

function groupedTaskRows(items, type = "tasks", completed = false, manage = false) {
  const row = type === "tasks" ? item => taskRow(item, true) :
    item => `<article class="task-entry">${routineRow(item, completed, !manage)}</article>`;
  const groups = new Map();
  for (const item of items) {
    if (!item.groupId) continue;
    if (!groups.has(item.groupId)) groups.set(item.groupId, []);
    groups.get(item.groupId).push(item);
  }
  const shown = new Set();
  return items.map(item => {
    if (!item.groupId) return row(item);
    if (shown.has(item.groupId)) return "";
    shown.add(item.groupId);
    return `<section class="task-group"><div class="between"><strong>${completed ? "함께 처리 · 완료" : "함께 처리"}</strong>
      <button class="quiet" data-group="${escapeHtml(item.groupId)}" data-group-type="${type}">묶음 수정</button></div>
      <div class="group-members">${groups.get(item.groupId).map(row).join("")}</div></section>`;
  }).join("");
}

function openTaskGroup(groupId, type = "tasks") {
  const routines = type === "routines";
  const items = (routines ? data.routines : todayTasks()).filter(item =>
    (groupId && item.groupId === groupId) || (!item.groupId && (routines || !item.done)));
  const label = routines ? "고정 업무" : "업무";
  editor.innerHTML = `<form><h2>${label} ${groupId ? "묶음 수정" : "묶기"}</h2>
    <p class="muted">함께 처리할 업무를 두 개 이상 선택해 주세요.</p>
    <div class="group-picker">${items.map(item => `<label><input type="checkbox" name="member" value="${escapeHtml(item.id)}"
      ${groupId && item.groupId === groupId ? "checked" : ""}> <span>${escapeHtml(item.title)}</span></label>`).join("")}</div>
    <p class="muted" data-group-error role="status"></p>
    <div class="actions">${groupId ? '<button type="button" data-ungroup>묶음 해제</button>' : "<span></span>"}
    <div><button type="button" data-group-cancel>취소</button> <button type="submit" class="primary">저장</button></div></div></form>`;
  const form = editor.querySelector("form");
  editor.querySelector("[data-group-cancel]").onclick = () => editor.close();
  const ungroup = editor.querySelector("[data-ungroup]");
  if (ungroup) ungroup.onclick = async () => {
    if (await change(next => next[type].filter(item => item.groupId === groupId).forEach(item => {delete item.groupId;}))) editor.close();
  };
  form.onsubmit = async event => {
    event.preventDefault();
    const chosen = new Set(new FormData(form).getAll("member"));
    const visible = new Set(items.map(item => item.id));
    const hiddenMembers = groupId ? data[type].filter(item => item.groupId === groupId && !visible.has(item.id)).length : 0;
    if (chosen.size + hiddenMembers < 2) {
      editor.querySelector("[data-group-error]").textContent = "업무를 두 개 이상 선택하거나 묶음을 해제해 주세요.";
      return;
    }
    const key = groupId || crypto.randomUUID();
    if (await change(next => {
      for (const item of next[type]) {
        if (chosen.has(item.id)) item.groupId = key;
        else if (item.groupId === key && visible.has(item.id)) delete item.groupId;
      }
    })) editor.close();
  };
  editor.showModal();
}

function routineRow(item, checked, showCheck = true) {
  const repeatLabel = item.repeat === "monthly" ? "매월 " + item.dayOfMonth + "일" :
    item.repeat === "daily" ? "평일 매일" : "매주 " + weekdays[item.weekday] + "요일";
  return `<div class="row ${checked ? "done" : ""}">

    <div><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(repeatLabel)}</small></div>

const trash = `<span class="trash-target" data-trash title="할 일을 여기에 끌어 놓으면 삭제" aria-label="휴지통" role="img">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path d="M4 6h16M9 6V3h6v3m3 0-1 15H7L6 6m4 4v7m4-7v7"/>
  </svg></span>`;

function weekPeriods(days, periods) {
  const first = days.find(Boolean), last = days.findLast(Boolean);
  const occupied = [];
  return periods.filter(item => taskStart(item) <= last && taskEnd(item) >= first).map(item => {
    const start = days.findIndex(key => key && key >= taskStart(item));
    const end = days.findLastIndex(key => key && key <= taskEnd(item));
    let lane = occupied.findIndex(column => column < start);
    if (lane < 0) lane = occupied.length;
    occupied[lane] = end;
    return {item, start, end, lane};
  });
}

function calendar() {
  const year = month.getFullYear(), number = month.getMonth();
  const first = new Date(year, number, 1).getDay();
  const last = new Date(year, number + 1, 0).getDate();
  const days = Array(first).fill("");
  for (let day = 1; day <= last; day++) {
    days.push(dateKey(new Date(year, number, day)));
  }
  const lastInMonth = days.at(-1);
  for (let day = 1; days.length % 7; day++) {
    days.push(dateKey(new Date(year, number + 1, day)));
  }
  const calendarTasks = data.tasks.filter(isCalendarTask);
  const periods = calendarTasks.filter(isPeriod).sort((a,b) => taskStart(a).localeCompare(taskStart(b)));
  const weeks = [];
  for (let index = 0; index < days.length; index += 7) {
    const week = days.slice(index, index + 7);
    const bars = weekPeriods(week, periods);
    const lanes = Math.max(0, ...bars.map(bar => bar.lane + 1));
    const cells = week.map(key => {
      if (!key) return '<span class="day-blank"></span>';
      const day = Number(key.slice(-2));
      const nextMonth = key > lastInMonth;
      const entries = calendarTasks.filter(item => !isPeriod(item) && taskEnd(item) === key)
        .sort((a,b) => (a.time || "").localeCompare(b.time || ""));
      const count = entries.length + bars.filter(bar => taskStart(bar.item) <= key && key <= taskEnd(bar.item)).length;
      return `<button class="day-cell${nextMonth ? " next-month-day" : ""}" data-date="${key}"
        aria-label="${nextMonth ? shortDate(key) : day + "일"}, 일정 ${count}건" aria-pressed="${selected === key}">
        <span class="day-number">${day}</span><span class="day-entries">${entries.map(item => `<span class="event">
          <span class="event-title">${escapeHtml((item.time ? item.time + " " : "") + item.title)}</span>
          ${item.memo ? `<span class="event-memo">${escapeHtml(item.memo)}</span>` : ""}
        </span>`).join("")}</span></button>`;
    });
    weeks.push(`<div class="calendar-week" data-lanes="${lanes}">${cells.join("")}
      <div class="period-lanes">${bars.map(({item,start,end,lane}) => `<button class="period-bar"
        data-edit="tasks" data-id="${item.id}" data-columns="${start + 1}/${end + 2}" data-lane="${lane + 1}"
        title="${escapeHtml(item.title)} · ${escapeHtml(taskStart(item))} ~ ${escapeHtml(taskEnd(item))}">
        ${escapeHtml(item.title)}</button>`).join("")}</div></div>`);
  }
  return `<section class="panel calendar-panel">
    <div class="between"><h2>${year}년 ${number + 1}월 캘린더</h2><div class="calendar-actions">
      <button data-edit="tasks" data-origin="calendar">+ 일정 추가</button>
      <button data-month="-1" aria-label="이전 달">‹</button> <button data-month="1" aria-label="다음 달">›</button></div></div>
    <div class="calendar-scroll">
    <div class="week">${weekdays.map(day => `<span>${day}</span>`).join("")}</div>
    <div class="calendar-grid">${weeks.join("")}</div></div>
  </section>`;
}

function applyListFocus() {
  const dashboard = workspace.querySelector(".dashboard-tasks");
  if (!dashboard) return;
  dashboard.dataset.focusedList = focusedList;
  const mainHeading = dashboard.querySelector("[data-dashboard-focus]");
  mainHeading.setAttribute("aria-expanded", String(focusedList !== "routines"));
  mainHeading.setAttribute("aria-pressed", String(focusedList === "tasks"));
  for (const panel of dashboard.querySelectorAll("[data-list-panel]")) {
    const key = panel.dataset.listPanel;
    const open = !focusedList || focusedList === key;
    const heading = panel.querySelector("[data-focus-list]");
    const list = panel.querySelector("[data-list-scroll]");
    if (!open && !list.hidden) listScroll[key] = list.scrollTop;
    const reopening = open && list.hidden;
    list.hidden = !open;
    panel.querySelector("[data-list-actions]").hidden = !open;
    heading.setAttribute("aria-expanded", String(open));
    heading.setAttribute("aria-pressed", String(focusedList === key));
    heading.querySelector("span").textContent = open ? (focusedList === key ? "⌃" : "⌄") : "›";
    if (reopening) list.scrollTop = listScroll[key];
  }
}

function positionTaskMemo(event) {
  const trigger = event.target.closest(".dashboard-list-scroll .memo-trigger");
  if (!trigger) return;
  const tip = trigger.nextElementSibling;
  const bounds = trigger.getBoundingClientRect();
  const left = Math.max(8, Math.min(bounds.left, window.innerWidth - tip.offsetWidth - 8));
  const top = bounds.bottom + tip.offsetHeight + 8 <= window.innerHeight
    ? bounds.bottom : Math.max(8, bounds.top - tip.offsetHeight);
  tip.style.setProperty("--memo-left", left + "px");
  tip.style.setProperty("--memo-top", top + "px");
}

workspace.addEventListener("pointerover", positionTaskMemo);
workspace.addEventListener("focusin", positionTaskMemo);

function renderTemplates() {
  const matches = data.templates.filter(item => item.title.toLowerCase().includes(filter.text.trim().toLowerCase()) &&
    (!filter.category || filter.category === item.category));
  document.querySelector("#template-list").innerHTML = matches.map(item =>
    `<article class="panel"><div class="between"><div><h2>${escapeHtml(item.title)}</h2><small>${item.category}</small></div><div>
      ${item.body ? `<button data-copy="${item.id}">본문 복사</button>` : ""} <button data-edit="templates" data-id="${item.id}">수정</button></div></div>
      ${item.body ? `<pre>${escapeHtml(item.body)}</pre>` : ""}${attachmentGallery(item.attachments)}</article>`).join("") || `<div class="panel">${empty("표시할 양식이 없어요.")}</div>`;
}

function attachmentGallery(files = [], editable = false) {
  if (!files.length) return "";
  return `<div class="attachment-gallery">${files.map((file,index) => {
    if (!/^data:image\/(?:webp|jpeg);base64,[A-Za-z0-9+/]+=*$/.test(file.src)) return "";
    const label = escapeHtml(file.name);
    return `<div class="attachment-card"><button type="button" data-view-image aria-label="${label} 크게 보기">
      <img src="${file.src}" alt="${label}" loading="lazy"></button>
      ${editable ? `<button type="button" data-remove-image="${index}">삭제</button>` : ""}</div>`;
  }).join("")}</div>`;
}

async function prepareAttachment(file) {
  if (!attachmentTypes.includes(file.type) || file.size > 12 * 1024 * 1024) {
    throw new Error("12MB 이하의 PNG, JPG, WebP 이미지를 선택해 주세요.");
  }
  const image = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  try {
    for (let longest = 1600; longest >= 540; longest = Math.floor(longest * .75)) {
      const scale = Math.min(1, longest / Math.max(image.width, image.height));
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      const src = canvas.toDataURL("image/webp", .82);
      if (src.length <= 400000 && src.startsWith("data:image/webp;base64,")) {
        return {name:(file.name || "붙여넣은 이미지").slice(0,120),src};
      }
    }
    throw new Error("이미지를 저장할 수 없어요. 더 작은 이미지로 시도해 주세요.");
  } finally { image.close(); }
}

function bindAttachments(form, initial) {
  let files = [...initial];
  let busy = false;
  const picker = form.querySelector("[data-image-picker]");
  const list = form.querySelector("[data-image-list]");
  const info = form.querySelector("[data-image-status]");
  const submit = form.querySelector('button[type="submit"]');
  const draw = () => {list.innerHTML = attachmentGallery(files, true);};
  async function add(incoming) {
    if (busy || !incoming.length) return;
    busy = true;
    picker.disabled = true;
    submit.disabled = true;
    info.textContent = "이미지를 준비하고 있어요.";
    const errors = new Set();
    try {
      for (const file of incoming) {
        if (files.length >= attachmentLimit) {
          errors.add("한 항목에 이미지는 최대 6장까지 첨부할 수 있어요.");
          break;
        }
        try {files.push(await prepareAttachment(file));}
        catch (error) {errors.add(error instanceof DOMException ? "이미지 파일을 읽을 수 없어요." : error.message);}
      }
      draw();
      info.textContent = [...errors].join(" ");
    } finally {
      busy = false;
      picker.disabled = false;
      submit.disabled = false;
    }
  }
  picker.addEventListener("change", () => {
    const chosen = [...picker.files];
    picker.value = "";
    void add(chosen);
  });
  form.addEventListener("paste", event => {
    const images = [...(event.clipboardData?.files || [])].filter(file => file.type.startsWith("image/"));
    if (images.length) {
      event.preventDefault();
      void add(images);
    }
  });
  list.addEventListener("click", event => {
    const button = event.target.closest("[data-remove-image]");
    if (!button) return;
    files = files.filter((file,index) => index !== Number(button.dataset.removeImage));
    draw();
  });
  draw();
  return {files:() => files, busy:() => busy, report:text => {info.textContent = text;}};
}

function quickDate(value, year = demo.now().getFullYear()) {
  if (!/^\d{4}$/.test(value)) return "";
  const key = year + "-" + value.slice(0, 2) + "-" + value.slice(2);
  return dateKey(parseDate(key)) === key ? key : "";
}

function quickTime(value) {
  const digits = value.match(/^(\d{2})(?::?)(\d{2})$/);
  const words = value.match(/^(?:(오전|오후)\s*)?(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?$/);
  if (!digits && !words) return "";
  let hour = Number(digits ? digits[1] : words[2]);
  const minute = Number(digits ? digits[2] : words[3] || 0);
  if (words?.[1]) {
    if (hour < 1 || hour > 12) return "";
    hour = hour % 12 + (words[1] === "오후" ? 12 : 0);
  }
  if (hour > 23 || minute > 59) return "";
  return [hour, minute].map(value => String(value).padStart(2, "0")).join(":");
}

function openEditor(type, id, range, origin = "tasks") {
  const item = data[type].find(entry => entry.id === id);
  const supportsImages = type === "templates" || type === "notes";
  const calendarEntry = type === "tasks" && (origin === "calendar" || (item && isCalendarTask(item)));
  const typeName = {tasks:calendarEntry ? "일정" : "할 일", routines:"고정 업무", templates:"업무 양식", notes:"월간 메모"}[type];
  const fields = {
    tasks:`<div class="date-fields"><label>날짜 / 종료일<input name="date" type="date" value="${escapeHtml(range?.end ?? item?.date ?? (calendarEntry ? selected : ""))}"></label>
      <label>날짜 빠른 입력<input name="fastDate" inputmode="numeric" maxlength="4" placeholder="예: 1130"></label></div>
      <label>기간 시작일<input name="startDate" type="date" value="${escapeHtml(range?.start ?? item?.startDate ?? "")}"></label>
      <div class="date-fields"><label>시간<input name="time" type="time" value="${escapeHtml(item?.time)}"></label>
      <label>시간 빠른 입력<input name="fastTime" maxlength="20" placeholder="예: 1010, 10시 10분"></label></div>
      <small>날짜를 비우면 오늘로 등록돼요. 날짜만 지정하면 오전 7시 30분, 시간을 지정하면 5분 전에 알림이 떠요. 기간 일정 알림은 종료일 기준이에요.</small>
      <label>일정 메모<textarea name="memo" class="short-memo" maxlength="1000">${escapeHtml(item?.memo)}</textarea></label>`,
    routines:`<label>반복<select name="repeat"><option value="daily">평일 매일</option>
      <option value="weekly" ${item?.repeat === "weekly" ? "selected" : ""}>매주</option>
      <option value="monthly" ${item?.repeat === "monthly" ? "selected" : ""}>매월</option></select></label>
      <label id="weekday-label">요일<select name="weekday">${weekdays.slice(1,6).map((day,index) =>
        `<option value="${index + 1}" ${Number(item?.weekday) === index + 1 ? "selected" : ""}>${day}요일</option>`).join("")}</select></label>
      <label id="month-day-label">매월 날짜<input type="number" name="dayOfMonth" min="1" max="31" step="1" required value="${escapeHtml(item?.dayOfMonth ?? demo.now().getDate())}">
      <small>주말이면 다음 근무일, 그달에 없는 날짜면 마지막 근무일에 표시해요.</small></label>`,
    templates:`<label>분류<select name="category">${categories.map(category => `<option ${item?.category === category ? "selected" : ""}>${category}</option>`).join("")}</select></label>
      <label>본문<textarea name="body" maxlength="25000">${escapeHtml(item?.body)}</textarea></label>`,
    notes:`<label>본문<textarea name="body" maxlength="25000">${escapeHtml(item?.body)}</textarea></label>
      <label class="note-carry"><input name="carry" type="checkbox" ${item?.carry ? "checked" : ""}> 다음 달 첫 7일에도 표시</label>`
  };
  editor.innerHTML = `<form><h2>${typeName} ${item ? "수정" : "추가"}</h2>
    <label>제목<input name="title" value="${escapeHtml(item?.title)}" required maxlength="120" autofocus></label>${fields[type]}
    ${supportsImages ? `<label>이미지 첨부<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-image-picker></label>
    <small>파일을 선택하거나 편집 창에서 Ctrl+V로 붙여넣으세요. 최대 6장, 파일당 12MB.</small>
    <div data-image-list></div><p class="muted" data-image-status role="status"></p>` : ""}
    <div class="actions"><div>${item ? '<button type="button" data-delete>삭제</button>' : ""}</div><div>
      <button type="button" data-cancel>취소</button> <button class="primary" type="submit">저장</button>
    </div></div></form>`;
  const form = editor.querySelector("form");
  const attachments = supportsImages ? bindAttachments(form, item?.attachments || []) : null;
  if (type === "tasks") {
    for (const [quick, native, parse, example] of [
      ["fastDate", "date", quickDate, "날짜를 1130처럼 입력해 주세요."],
      ["fastTime", "time", quickTime, "시간을 1010 또는 10시 10분처럼 입력해 주세요."]
    ]) {
      const shortcut = form.elements[quick], picker = form.elements[native];
      shortcut.addEventListener("input", () => {
        const value = shortcut.value.trim();
        const result = value ? parse(value) : "";
        shortcut.setCustomValidity(value && !result ? example : "");
        picker.value = result;
      });
      picker.addEventListener("input", () => {
        shortcut.value = "";
        shortcut.setCustomValidity("");
      });
    }
  }
  if (type === "routines") {
    const toggleDay = () => {
      const repeat = form.elements.repeat.value;
      editor.querySelector("#weekday-label").hidden = repeat !== "weekly";
      editor.querySelector("#month-day-label").hidden = repeat !== "monthly";
      form.elements.dayOfMonth.disabled = repeat !== "monthly";
    };
    form.elements.repeat.addEventListener("change", toggleDay);
    toggleDay();
  }
  editor.querySelector("[data-cancel]").onclick = () => editor.close();
  const remove = editor.querySelector("[data-delete]");
  if (remove) remove.onclick = async () => {
    if (confirm("이 항목을 삭제할까요?") && await change(next => {
      next[type] = next[type].filter(entry => entry.id !== id);
    })) editor.close();
  };
  form.onsubmit = async event => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(form));
    fields.title = fields.title.trim();
    if (!fields.title) return message("제목을 입력해 주세요.");
    if (type === "tasks") {
      delete fields.fastDate;
      delete fields.fastTime;
      if (fields.startDate && (!fields.date || fields.startDate > fields.date)) {
        const end = form.elements.date;
        end.setCustomValidity("시작일과 같거나 그 이후의 종료일을 지정해 주세요.");
        end.reportValidity();
        end.setCustomValidity("");
        return;
      }
      if (fields.startDate === fields.date) fields.startDate = "";
      if (fields.time && !fields.date) fields.date = dateKey();
      if (!fields.date && (!item || item.date)) fields.created = dateKey();
      fields.origin = calendarEntry ? "calendar" : "tasks";
    }
    if (attachments) {
      if (attachments.busy()) return;
      fields.attachments = attachments.files();
      if (!fields.body.trim() && !fields.attachments.length) return attachments.report("본문이나 이미지를 추가해 주세요.");
    }
    if (type === "notes") {
      fields.month = item?.month ?? dateKey().slice(0, 7);
      fields.carry = form.elements.carry.checked;
    }
    if (await change(next => {
      if (item) {
        const entry = next[type].find(candidate => candidate.id === id);
        if (type === "routines" && (entry.repeat !== fields.repeat ||
            (fields.repeat === "weekly" && entry.weekday !== fields.weekday) ||
            (fields.repeat === "monthly" && entry.dayOfMonth !== fields.dayOfMonth))) {
          Object.assign(entry, {start:today, checkedOn:"", completedOccurrence:""});
        }
        Object.assign(entry, fields);
      } else {
        next[type].unshift({id:crypto.randomUUID(), created:today, start:today, ...fields});
      }
    }, attachments?.report)) {
      editor.close();
      message("저장했어요.");
    }
  };
  editor.showModal();
}

document.addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button || !data) return;
  const action = button.dataset;
  if (action.page) {
    if (action.page === "today" && page !== "today") noteFilter = {text:"", month:""};
    page = action.page;
    render();
  }
  if (action.edit) openEditor(action.edit, action.id, undefined, action.origin);
  if (action.focusList) {
    focusedList = focusedList === action.focusList ? "" : action.focusList;
    applyListFocus();
  }
  if ("viewImage" in action) {
    const source = button.querySelector("img");
    const viewer = document.querySelector("#image-viewer");
    const image = viewer.querySelector("img");
    image.src = source.src;
    image.alt = source.alt;
    viewer.showModal();
  }
  if (Object.hasOwn(themes, action.pickTheme) && action.pickTheme !== activeTheme()) {
    await change(next => {next.theme = action.pickTheme;});
    workspace.querySelector(`[data-pick-theme="${action.pickTheme}"]`)?.focus();
  }
  if (action.expandTask) {
    const id = action.expandTask;
    if (expandedTasks.has(id)) expandedTasks.delete(id);
    else expandedTasks.add(id);
    const expanded = expandedTasks.has(id);
    button.setAttribute("aria-expanded", String(expanded));
    button.querySelector("span").textContent = expanded ? "⌄" : "›";
    document.getElementById("checklist-" + id).hidden = !expanded;
  }
  if (action.addChild) {
    const form = document.getElementById("checklist-" + action.addChild).querySelector("form");
    form.hidden = false;
    form.elements.title.focus();
  }
  if (action.removeChild) await change(next => {
    const item = next.tasks.find(task => task.id === action.id);
    item.checklist = item.checklist.filter(child => child.id !== action.removeChild);
  });
  if ("group" in action) openTaskGroup(action.group, action.groupType);
  if (action.star) await change(next => {
    const item = next.tasks.find(entry => entry.id === action.star);
    item.starredAt = item.starredAt ? 0 : demo.now().getTime();
  });
  if (action.month) {
    month = new Date(month.getFullYear(), month.getMonth() + Number(action.month), 1);
    selected = dateKey(month);
    render();
  }
  if (action.date && (event.detail === 0 || performance.now() >= suppressDateClickUntil)) {
    selected = action.date; page = "calendar"; render();
  }
  if (action.copy) {
    try {
      await demo.copy(data.templates.find(item => item.id === action.copy).body);
      message("본문을 복사했어요.");
    } catch { message("복사하지 못했어요. 본문을 선택해 복사해 주세요."); }
  }
  if ("test" in action) {
    try {
      const response = await demo.request("/api/test", {method:"POST", headers:{"Content-Type":"application/json"}});
      if (!response.ok) message("테스트 알림을 보낼 수 없어요.");
    } catch { message("테스트 알림을 보낼 수 없어요."); }
  }
});

function dateAtPointer(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const week = hit?.closest(".calendar-week");
  if (!week) return "";
  const cell = hit.closest("[data-date]");
  if (cell) return cell.dataset.date;
  const bounds = week.getBoundingClientRect();
  const column = Math.floor((event.clientX - bounds.left) * 7 / bounds.width);
  return week.children[column]?.dataset.date || "";
}

document.addEventListener("pointerdown", event => {
  const cell = event.target.closest("[data-date]");
  if (!cell || event.button !== 0 || event.pointerType === "touch") return;
  rangeDrag = {pointer:event.pointerId, start:cell.dataset.date, end:cell.dataset.date};
  suppressDateClickUntil = 0;
});

document.addEventListener("pointermove", event => {
  if (rangeDrag?.pointer !== event.pointerId) return;
  const end = dateAtPointer(event);
  if (!end || end === rangeDrag.end) return;
  rangeDrag.end = end;
  const [first, last] = [rangeDrag.start, end].sort();
  workspace.querySelectorAll("[data-date]").forEach(cell => {
    cell.classList.toggle("range-preview", first !== last && first <= cell.dataset.date && cell.dataset.date <= last);
  });
});

function clearRange() {
  rangeDrag = undefined;
  workspace.querySelectorAll(".range-preview").forEach(cell => cell.classList.remove("range-preview"));
}

document.addEventListener("pointerup", event => {
  if (rangeDrag?.pointer !== event.pointerId) return;
  const [start, end] = [rangeDrag.start, dateAtPointer(event) || rangeDrag.end].sort();
  clearRange();
  if (start !== end) {
    suppressDateClickUntil = performance.now() + 500;
    openEditor("tasks", undefined, {start, end}, "calendar");
  }
});
document.addEventListener("pointercancel", clearRange);
window.addEventListener("blur", clearRange);

function resetTaskDrag() {
  draggedTask = undefined;
  workspace.querySelector("[data-trash]")?.classList.remove("ready", "over");
}
document.addEventListener("dragstart", event => {
  const grip = event.target.closest("[data-drag-task]");
  if (!grip) return;
  draggedTask = grip.dataset.dragTask;
  event.dataTransfer.setData("text/plain", draggedTask);
  event.dataTransfer.effectAllowed = "move";
  const row = grip.closest(".row");
  event.dataTransfer.setDragImage(row, 12, row.offsetHeight / 2);
  workspace.querySelector("[data-trash]")?.classList.add("ready");
});
document.addEventListener("dragover", event => {
  const target = event.target.closest("[data-trash]");
  if (!target || !draggedTask) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  target.classList.add("over");
});
document.addEventListener("dragleave", event => {
  const target = event.target.closest("[data-trash]");
  if (target && !target.contains(event.relatedTarget)) target.classList.remove("over");
});
document.addEventListener("dragend", resetTaskDrag);
document.addEventListener("drop", async event => {
  if (!event.target.closest("[data-trash]") || !draggedTask) return;
  event.preventDefault();
  const id = draggedTask;
  resetTaskDrag();
  if (await change(next => { next.tasks = next.tasks.filter(item => item.id !== id); })) {
    message("할 일을 삭제했어요.");
  }
});

document.addEventListener("input", event => {
  if (event.target.id === "search") { filter.text = event.target.value; renderTemplates(); }
  if (event.target.id === "note-search") { noteFilter.text = event.target.value; renderNotes(); }
});

document.addEventListener("submit", async event => {
  const form = event.target;
  const id = form.dataset.checklistForm;
  if (!id) return;
  event.preventDefault();
  const title = form.elements.title.value.trim();
  if (!title) return;
  const saved = await change(next => {
    const item = next.tasks.find(task => task.id === id);
    (item.checklist ??= []).push({id:crypto.randomUUID(), title, done:false});
  });
  const current = document.getElementById("checklist-" + id)?.querySelector("form");
  if (current) {
    current.hidden = false;
    current.elements.title.value = saved ? "" : title;
    current.elements.title.focus();
  }
});

document.addEventListener("change", async event => {
  const input = event.target;
  if (input.dataset.checklistTask) {
    await change(next => {
      const item = next.tasks.find(task => task.id === input.dataset.checklistTask);
      const child = item.checklist.find(entry => entry.id === input.dataset.child);
      child.done = input.checked;
    });
    document.getElementById(input.id)?.focus();
    return;
  }
  if (input.id === "category-filter") { filter.category = input.value; renderTemplates(); }
  if (input.id === "note-month") { noteFilter.month = input.value; renderNotes(); }
  if (input.dataset.carry) await change(next => {
    next.notes.find(item => item.id === input.dataset.carry).carry = input.checked;
  });
  if (input.id === "weekends") await change(next => { next.weekends = input.checked; });
  const type = input.dataset.check;
  if (!type) return;
  await change(next => {
    const item = next[type].find(entry => entry.id === input.dataset.id);
    if (type === "tasks") {
      item.done = input.checked;
      item.completed = input.checked ? today : "";
      if (!input.checked && item.starredAt) item.starredAt = demo.now().getTime();
    } else {
      item.checkedOn = input.checked ? today : "";
      item.completedOccurrence = input.checked ? latestOccurrence(item, today) : "";
    }
  });
});

function refreshDay() {
  if (!data || today === dateKey()) return;
  const previous = today;
  today = dateKey();
  if (selected === previous) { selected = today; month = parseDate(today); }
  render();
}
function chatDate(text, base = demo.now(), shorthand = false) {
  const monthDay = text.match(/(?:(\d{4})년\s*)?(\d{1,2})월\s*(\d{1,2})일/);
  const iso = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  const compact = shorthand && text.match(/(?:^|\s)(\d{2})(\d{2})(?=\s|로|에|까지|$)/);
  const match = monthDay || iso || compact;
  if (match) {
    const year = Number((compact && !monthDay && !iso ? null : match[1]) || base.getFullYear());
    const numbers = compact && !monthDay && !iso ? [match[1], match[2]] : [match[2], match[3]];
    const key = quickDate(numbers.map(n => n.padStart(2,"0")).join(""), year);
    return {key, raw:match[0]};
  }
  const relative = text.match(/오늘|내일|낼(?=\s|로|까지|$)|모레/);
  if (relative) {
    const offset = {오늘:0, 내일:1, 낼:1, 모레:2}[relative[0]];
    const date = new Date(base);
    date.setDate(date.getDate() + offset);
    return {key:dateKey(date), raw:relative[0]};
  }
  const day = text.match(/(?:(다음|이번)\s*주\s*)?([일월화수목금토])(?:요일|욜)(?=\s|에|로|까지|$)/);
  if (!day) return null;
  const index = weekdays.indexOf(day[2]);
  const within = (index + 6) % 7 - (base.getDay() + 6) % 7;
  const date = new Date(base);
  date.setDate(date.getDate() + (day[1] === "다음" ? within + 7 : day[1] === "이번" ? within : (index - base.getDay() + 7) % 7));
  return {key:dateKey(date), raw:day[0]};
}

function chatRange(text, base) {
  const weekly = text.match(/(다음|이번)\s*주\s*([일월화수목금토])(?:요일|욜)?\s*[~～–-]\s*([일월화수목금토])(?:요일|욜)?/);
  if (weekly) {
    const start = chatDate(weekly[1] + "주 " + weekly[2] + "요일", base).key;
    const end = chatDate(weekly[1] + "주 " + weekly[3] + "요일", base).key;
    return {start, end, raw:weekly[0]};
  }
  const span = text.match(/((?:\d{4}년\s*)?\d{1,2}월\s*\d{1,2}일)\s*(?:부터|[~～–-])\s*((?:\d{1,2}월\s*)?\d{1,2}일)(?:까지)?/);
  if (!span) return null;
  const start = chatDate(span[1], base).key;
  if (!start) return {start:"",end:"",raw:span[0]};
  const end = chatDate(span[2].includes("월") ? span[2] : Number(start.slice(5,7)) + "월 " + span[2], parseDate(start)).key;
  return {start,end,raw:span[0]};
}

function chatTime(text) {
  const match = text.match(/(?:오전|오후)?\s*\d{1,2}\s*시(?:\s*\d{1,2}\s*분)?|(?:오전|오후)?\s*\d{1,2}:\d{2}/);
  if (!match) return null;
  const raw = match[0].trim();
  const colon = raw.match(/^(?:(오전|오후)\s*)?(\d{1,2}):(\d{2})$/);
  const value = colon ? (colon[1] || "") + " " + colon[2] + "시 " + colon[3] + "분" : raw;
  return {raw, key:quickTime(value.trim())};
}

function chatTitle(text) {
  return text.replace(/[“”"']/g, "").replace(/(?:등록|추가|저장|입력|박제|기록|넣어)(?:\s*(?:해\s*)?줘|\s*해|\s*주세요)?[.!?\s]*$/g, "")
    .replace(/(?:하는\s*거|할\s*거|\s*챙겨야\s*(?:돼|해)|해야\s*(?:돼|해)|\s*하는\s*일)[.!?\s]*$/g, "")
    .replace(/^[\s,:]+|[\s,.!?]+$/g, "").trim();
}

function chatAddition(text, base = demo.now()) {
  const calendarEntry = /(?:캘린더|캘린덕|달력)(?:에|로)/.test(text);
  const repeat = !calendarEntry && text.match(/평일마다|평일\s*매일|매일|매주\s*([일월화수목금토])(?:요일|욜)?|매(?:달|월)\s*(\d{1,2})일(?:쯤)?/);
  const range = !repeat && chatRange(text, base);
  const day = !repeat && !range && chatDate(text, base);
  const time = !repeat && chatTime(text);
  let title = text.replace(/(?:캘린더|캘린덕|달력)(?:에|로)/g, "").replace(/(?:할 일|고정 업무)에/g, "");
  for (const marker of [repeat?.[0], range?.raw, day?.raw, time?.raw]) {
    if (marker) title = title.replace(marker, "\u0001");
  }
  title = chatTitle(title.replace(/\u0001(?:에|로|까지|부터|쯤)?/g, " ").replace(/\s+/g, " "));
  if (!title || title.length > 120) return {error:"업무 제목을 120자 이내로 적어 주세요."};
  if (repeat) {
    const weekday = weekdays.indexOf(repeat[1]);
    const monthday = Number(repeat[2] || 0);
    if ((repeat[1] && (weekday < 1 || weekday > 5)) || (repeat[2] && (monthday < 1 || monthday > 31))) {
      return {error:"반복 요일은 월~금, 매월 날짜는 1~31일 중에서 지정해 주세요."};
    }
    const frequency = repeat[1] ? "weekly" : repeat[2] ? "monthly" : "daily";
    const label = repeat[1] ? "매주 " + weekdays[weekday] + "요일" : repeat[2] ? "매월 " + monthday + "일" : "평일 매일";
    return {type:"routines", fields:{title,repeat:frequency,weekday:String(weekday),dayOfMonth:String(monthday)},label:"고정 업무 · " + label,
      uncertain:/쯤/.test(repeat[0])};
  }
  if ((day && !day.key) || (range && (!range.start || !range.end || range.start > range.end)) || (time && !time.key)) {
    return {error:"입력한 날짜나 시간을 확인해 주세요."};
  }
  const date = range ? range.end : day?.key || (time ? dateKey(base) : "");
  if (calendarEntry && !date) return {error:"캘린더에 추가할 날짜도 적어 주세요."};
  return {type:"tasks",fields:{title,date,time:time?.key || "",startDate:range?.start || "",memo:"",origin:calendarEntry ? "calendar" : "tasks"},
    label:calendarEntry ? "캘린더" : "할 일", uncertain:false};
}

function chatSearchTerms(text) {
  return text.toLocaleLowerCase().replace(/[“”"'...,:!?]/g," ").split(/\s+/).map(term =>
    term.replace(/(?:에게|한테|에서|으로|을|를|에|의|건)$/,"")
  ).filter(term => term.length >= 2 && !/^(?:하는|쓰는|있는|했던|싶어|때|해줘|찾아줘|찾아|찾기|메모|양식|템플릿|지난달|이번달|이달|바로|보여줘|열어줘|주세요|알려줘|줘)$/.test(term));
}

function chatMatches(items, query) {
  const terms = chatSearchTerms(query);
  return items.map(item => {
    const title = item.title.toLocaleLowerCase();
    const body = (item.body || item.category || "").toLocaleLowerCase();
    const score = terms.reduce((sum, term) => sum + (title.includes(term) ? 4 : body.includes(term) ? 1 : 0),0);
    return {item, score};
  }).filter(result => !terms.length || result.score > 0).sort((a,b) => b.score - a.score).map(result => result.item);
}

function setupChat() {
  const panel = document.querySelector("#work-chat");
  if (!panel) return;
  const launcher = document.querySelector("#chat-launch");
  const input = document.querySelector("#chat-input");
  const form = document.querySelector("#chat-form");
  const log = document.querySelector("#chat-log");
  let results = [];
  let recentId;
  let pending = false;
  let composing = false;
  const append = (element, target = log) => {
    target.append(element);
    log.scrollTop = log.scrollHeight;
    return element;
  };
  const text = (value, cls = "chat-bot", target = log) => {
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = value;
    return append(p, target);
  };
  const buttons = target => {const area = document.createElement("div"); area.className = "chat-buttons"; return append(area, target);};
  const button = (target, title, run) => {
    const control = document.createElement("button");
    control.type = "button";
    control.textContent = title;
    control.onclick = run;
    append(control,target);
    return control;
  };
  const say = value => text(value);
  const find = (type, id) => data?.[type].find(item => item.id === id);
  const toggle = open => {
    panel.hidden = !open;
    launcher.setAttribute("aria-expanded", String(open));
    launcher.setAttribute("aria-label", open ? "업무 챗봇 닫기" : "업무 챗봇 열기");
    (open ? input : launcher).focus();
  };
  launcher.onclick = () => toggle(panel.hidden);
  panel.querySelector("[data-close-chat]").onclick = () => toggle(false);
  panel.addEventListener("keydown", event => {if (event.key === "Escape") toggle(false);});

  function showDocument(type,id) {
    const item = find(type,id);
    if (!item) return say("항목이 삭제되었거나 이름이 바뀌었어요. 다시 찾아 주세요.");
    editor.innerHTML = `<form method="dialog"><h2>${escapeHtml(item.title)}</h2>
      <small>${escapeHtml(item.month || item.category)}</small><pre>${escapeHtml(item.body)}</pre>
      ${attachmentGallery(item.attachments)}<div class="actions">
      ${type === "templates" && item.body ? `<button type="button" data-copy="${escapeHtml(item.id)}">본문 복사</button>` : "<span></span>"}
      <button value="close">닫기</button></div></form>`;
    editor.showModal();
  }

  function showResults(type, items) {
    results = items.slice(0,6).map(item => ({type,id:item.id}));
    if (!items.length) return say("일치하는 항목을 찾지 못했어요. 제목에 들어간 단어로 다시 찾아보세요.");
    say(items.length === 1 ? "찾았어요." : "비슷한 항목이 있어요. 원하는 항목을 골라 주세요.");
    const area = document.createElement("div");
    area.className = "chat-results";
    append(area);
    for (const [index, {id}] of results.entries()) {
      const item = find(type,id);
      const card = document.createElement("div");
      card.className = "chat-result";
      const title = document.createElement("strong");
      title.textContent = (results.length > 1 ? (index + 1) + ". " : "") + item.title;
      card.append(title);
      text(item.month || item.category || "", "muted", card);
      if (item.body) text(item.body.slice(0,110), "chat-snippet", card);
      const actions = buttons(card);
      button(actions, type === "notes" ? "메모 열기" : "양식 열기", () => showDocument(type,id));
      if (type === "templates" && item.body) button(actions,"본문 복사",async () => {
        const latest = find(type,id);
        if (!latest?.body) return say("복사할 본문을 찾을 수 없어요.");
        try {await demo.copy(latest.body); say("본문을 복사했어요.");}
        catch {say("복사하지 못했어요. 양식을 열어 본문을 선택해 주세요.");}
      });
      append(card,area);
    }
  }

  const details = item => [item.startDate ? item.startDate + " ~ " + item.date : item.date, item.time].filter(Boolean).join(" ");
  const commit = async (type, after, before, summary) => {
    const same = (left,right) => JSON.stringify(left) === JSON.stringify(right);
    if (before && !same(find(type,after.id),before)) return say("업무가 바뀌었어요. 다시 요청해 주세요.");
    const saved = await change(next => {
      const index = next[type].findIndex(item => item.id === after.id);
      if (index < 0) next[type].unshift(after);
      else next[type][index] = after;
    }, say);
    if (!saved) return;
    recentId = after.id;
    say(summary);
    const action = buttons(log);
    button(action, "되돌리기", async () => {
      if (!same(find(type,after.id),after)) return say("이후에 편집된 항목이라 자동으로 되돌릴 수 없어요.");
      if (await change(next => {
        const index = next[type].findIndex(item => item.id === after.id);
        if (before) next[type][index] = before;
        else next[type].splice(index,1);
      },say)) {
        action.remove();
        say("변경을 되돌렸어요.");
      }
    });
  };

  function proposeChange(candidates, transform, label) {
    if (!candidates.length) return say("바꿀 업무를 찾지 못했어요. 제목을 조금 더 자세히 적어 주세요.");
    const propose = item => {
      if (!item) return say("업무를 찾을 수 없어요.");
      const after = transform(item);
      const when = details(after);
      const block = text(`‘${item.title}’ ${label}${when ? " · " + when : ""}.`);
      const area = buttons(block);
      button(area, "확인", async () => {area.remove(); await commit("tasks",after,item,`‘${item.title}’ 업무를 변경했어요.`);});
      button(area, "취소", () => {area.remove(); say("변경을 취소했어요.");});
    };
    if (candidates.length === 1) return propose(candidates[0]);
    const area = buttons(text("비슷한 업무가 여러 개예요. 바꿀 업무를 골라 주세요."));
    for (const item of candidates.slice(0,6)) button(area,item.title + (details(item) ? " · " + details(item) : ""),() => {
      area.remove();
      propose(find("tasks",item.id));
    });
  }

  async function respond(query) {
    if (!data) return say("업무를 불러온 뒤 다시 보내 주세요.");
    const normalized = query.replace(/지난\s*달/g,"지난달").replace(/이번\s*달/g,"이번달");
    const ordinal = normalized.match(/(?:그중(?:에)?\s*)?([1-6일이삼사오육]|첫|두|세|네|다섯|여섯)\s*(?:번째|번).*?(?:열어|보여)/);
    if (ordinal) {
      const labels = {첫:1,두:2,세:3,네:4,다섯:5,여섯:6,일:1,이:2,삼:3,사:4,오:5,육:6};
      const entry = results[(labels[ordinal[1]] || Number(ordinal[1])) - 1];
      return entry ? showDocument(entry.type,entry.id) : say("해당 번호의 검색 결과가 없어요.");
    }
    const type = /양식|템플릿/.test(normalized) ? "templates" : /메모/.test(normalized) ? "notes" : "";
    const explicitAdd = /(?:추가|등록|박제|넣어|기록|저장)/.test(normalized);
    if (type && !explicitAdd) {
      const monthFilter = normalized.match(/지난달|이번달|이달|(?:\d{4}년\s*)?\d{1,2}월/);
      const base = parseDate(dateKey());
      let filterMonth = "";
      if (monthFilter && type === "notes") {
        const marker = monthFilter[0];
        const explicitMonth = marker.match(/(?:(\d{4})년\s*)?(\d{1,2})월/);
        if (explicitMonth && (+explicitMonth[2] < 1 || +explicitMonth[2] > 12)) return say("작성 월은 1~12월 중에서 지정해 주세요.");
        if (explicitMonth) base.setFullYear(+(explicitMonth[1] || base.getFullYear()),+explicitMonth[2]-1,1);
        else if (marker === "지난달") base.setMonth(base.getMonth()-1,1);
        filterMonth = dateKey(base).slice(0,7);
      }
      const items = data[type].filter(item => !filterMonth || item.month === filterMonth);
      return showResults(type,chatMatches(items,filterMonth ? normalized.replace(monthFilter[0]," ") : normalized));
    }
    const postpone = /미뤄|옮겨|연기|시간.*바꿔|날짜.*바꿔|로\s*바꿔/.test(normalized);
    const complete = /(?:완료(?:했어|\s*처리|\s*체크|해줘)?|끝냈어|다\s*(?:봤어|했어)|처리했어)[.!?\s]*$/.test(normalized);
    if (postpone || complete) {
      const day = postpone && chatDate(normalized,demo.now(),true);
      const time = postpone && chatTime(normalized);
      if (postpone && ((!day && !time) || (day && !day.key) || (time && !time.key))) return say("변경할 날짜나 시간을 적어 주세요. 예를 들어 ‘금요일 오후 2시로 미뤄줘’처럼요.");
      let queryText = normalized.replace(/아까\s*(?:넣은|등록한)?|방금\s*(?:넣은|등록한)?|그거/g," ");
      for (const marker of [day?.raw,time?.raw]) if (marker) queryText = queryText.replace(marker," ");
      queryText = queryText.replace(/(?:\b|\s)(?:에|로)\s*(?=미뤄|옮겨|바꿔)/g," ").replace(/미뤄줘|미뤄|옮겨줘|옮겨|연기(?:해줘)?|(?:날짜|시간)?\s*바꿔줘|바꿔|완료(?:했어|\s*처리|\s*체크|해줘)?|끝냈어|다\s*(?:봤어|했어)|처리했어/g," ");
      const open = data.tasks.filter(item => !item.done);
      const candidates = !chatSearchTerms(queryText).length ? open.filter(item => item.id === recentId) : chatMatches(open,queryText);
      return proposeChange(candidates, item => {
        if (complete) return {...item,done:true,completed:dateKey()};
        let date = day?.key || item.date || dateKey();
        let startDate = item.startDate || "";
        if (day && startDate && item.date) {
          const length = Math.round((parseDate(item.date) - parseDate(startDate)) / 86400000);
          startDate = day.key;
          const end = parseDate(startDate);
          end.setDate(end.getDate() + length);
          date = dateKey(end);
        }
        return {...item,date,startDate,time:time?.key || item.time || ""};
      }, complete ? "완료할게요" : "일정을 바꿀게요");
    }
    if (/삭제|지워|취소해|\?|알려줘|찾아|열어|보여|복사|목록/.test(normalized) || /(?:하고|해서|그리고).+(?:추가|넣어|등록)/.test(normalized)) {
      return say("이 문장은 바로 처리하기 어려워요. 업무 하나를 적거나 ‘정산 메모 찾아줘’, ‘회의 자료 완료해줘’처럼 요청해 주세요.");
    }
    if (/^(?:매주|매월|매달)\s/.test(normalized) && !/매주\s*[일월화수목금토]|매(?:월|달)\s*\d{1,2}일/.test(normalized)) {
      return say("반복할 요일이나 날짜를 함께 적어 주세요.");
    }
    const next = chatAddition(normalized);
    if (next.error) return say(next.error);
    const now = dateKey();
    const item = {id:crypto.randomUUID(),created:now,start:now,...next.fields};
    const summary = `‘${item.title}’ 등록 완료 · ${next.label}${details(item) ? " · " + details(item) : ""}`;
    if (!next.uncertain) return commit(next.type,item,null,summary);
    const area = buttons(text(`‘${item.title}’ · ${next.label}로 등록할까요?`));
    button(area,"등록",async () => {area.remove(); await commit(next.type,item,null,summary);});
    button(area,"취소",() => {area.remove(); say("등록을 취소했어요.");});
  }

  input.addEventListener("compositionstart", () => {composing = true;});
  input.addEventListener("compositionend", () => {composing = false;});
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && (composing || event.isComposing || event.keyCode === 229)) event.preventDefault();
  });
  form.onsubmit = async event => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query || pending || composing) return;
    pending = true;
    input.value = "";
    text(query,"chat-user");
    try {await respond(query);}
    catch {say("요청을 처리하지 못했어요. 한 가지씩 다시 적어 주세요.");}
    finally {pending = false;}
  };
}

setupChat();
setInterval(refreshDay, 15000);
document.addEventListener("visibilitychange", refreshDay);
load().catch(() => {
  workspace.innerHTML = heading("업무 데스크") + '<p>업무 데스크를 다시 실행한 뒤 이 페이지를 새로고침해 주세요.</p>';
});

document.querySelector("#demo-hour").onclick = () => {demo.advance(1); refreshDay();};
document.querySelector("#demo-day").onclick = () => {demo.advance(24); refreshDay();};
</script>
