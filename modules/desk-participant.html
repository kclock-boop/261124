<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 데스크 · 보고용 시연</title>
<style>:root{color-scheme:light;--navy:#0d1f37;--ivory:#f1eee5;--gold:#b3915d;--ink:#2d2d2d;--muted:#626773;--line:#c5c3bc;--paper:#fbf9f3;font:16px/1.55 "Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--ivory)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:226px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:.45rem .8rem}
button:hover{filter:brightness(.96)}
:focus-visible{outline:3px solid #80602b;outline-offset:3px}
.sidebar{background:var(--navy);color:var(--ivory);padding:26px 14px;position:sticky;top:0;height:100vh}
.brand{font-size:1.23rem;font-weight:800;padding:0 10px;margin-bottom:26px}
.brand-icon{color:#d5b580;margin-right:.35rem}
nav{display:grid;gap:6px}
nav button{text-align:left;color:inherit;background:none;border:0;border-inline-start:4px solid transparent;border-radius:6px;padding:.65rem .8rem}
nav button span{display:inline-block;width:1.35rem}
nav button[aria-current=page]{border-inline-start-color:var(--gold);background:#28394d;font-weight:700}
main{width:100%;max-width:1450px;padding:clamp(18px,3.5vw,52px);margin-inline:auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--navy)}
h1{font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.07em}
h2{font-size:1.2rem}
.sub,.muted,small{color:var(--muted)}
header,.between,.actions,.filter{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{margin-bottom:24px}
.primary{background:var(--gold);color:#101c2c;border-color:#a78550;font-weight:800}
.dash{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.55fr);gap:18px;align-items:start}
.dashboard-tasks header{margin-bottom:0}
.dashboard-calendar{min-width:0}
.stack{display:grid;gap:18px}
.panel{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:18px;min-width:0}
.rows{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #dedbd1}
.row:last-child{border-bottom:0}
.row div,.row label{flex:1;min-width:0;overflow-wrap:anywhere}
.row input{inline-size:20px;block-size:20px;accent-color:var(--navy);flex:none}
.row strong,.row small{display:block}
.done strong{text-decoration:line-through;color:var(--muted)}
.quiet{background:none;border:0;padding:.35rem .5rem}
.empty{padding:14px 0;color:var(--muted)}
.calendar-panel{padding:14px}
.calendar-actions{display:flex;gap:5px;flex-wrap:wrap}
.calendar-scroll{overflow-x:auto;margin-top:12px}
.week,.calendar-week,.period-lanes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week,.calendar-grid{min-width:540px}
.week{text-align:center;padding:5px 0;color:var(--navy);font-size:.875rem;background:#e7e3d9;border:1px solid var(--line);border-bottom:0;font-weight:700}
.calendar-grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.calendar-week{position:relative}
.day-blank,.day-cell{min-height:72px;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.day-cell{border-radius:0;min-width:0;background:transparent;text-align:left;align-content:start;padding:5px 6px;display:grid;gap:3px;user-select:none}
.day-cell.next-month-day{background:#f1efe8}
.next-month-day .day-number{color:#6e6d68}
.day-cell[aria-pressed=true]{background:#dbc49d;color:var(--navy)}
.day-cell[aria-pressed=true] .day-number{color:var(--navy)}
.day-cell.range-preview{background:#e7d3ac}
.day-entries{display:grid;gap:4px;margin-top:var(--period-space,0px);min-width:0}
.period-lanes{position:absolute;top:27px;inset-inline:0;grid-auto-rows:20px;pointer-events:none}
.period-bar{margin:1px 4px;min-width:0;padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:0;border-radius:4px;background:#ccb07a;color:var(--navy);font-size:.73rem;text-align:left;pointer-events:auto}
.period-bar:nth-child(even){background:#d6d9df}
.day-number{font-weight:800}
.event{display:grid;gap:1px;overflow-wrap:anywhere;font-size:.78rem;line-height:1.35}
.event-memo{color:#494640;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:pre-line}
.memo-text{white-space:pre-wrap;overflow-wrap:anywhere}
.note-filters{align-items:end;margin:10px 0 4px}
.note-filters label{display:grid;gap:3px;min-width:0;font-size:.875rem}
.note-search{flex:1 1 165px}
.note-month{flex:0 1 135px}
.note-row{padding:12px 0;border-bottom:1px solid #dedbd1}
.note-row:last-child{border-bottom:0}
.compact-note{padding:8px 0}
.compact-note summary{cursor:pointer;font-weight:650;overflow-wrap:anywhere}
.note-content{padding:10px 0 0 16px}
.note-row h3{font-size:1rem;overflow-wrap:anywhere}
.note-row p{margin:.35rem 0}
.note-carry,form .note-carry{display:flex;align-items:center;gap:5px;font-size:.875rem}
.note-carry input{accent-color:var(--navy)}
.short-memo{min-height:65px}
.date-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.date-fields input{width:100%;min-width:0}
.task-grip{cursor:grab;color:var(--muted);flex:none;user-select:none;font-size:1.1rem}
.row .task-star{padding:.2rem .15rem;font-size:1.12rem;line-height:1;color:#5b5852;flex:none}
.row .task-star[aria-pressed=true]{color:#88632d}
.trash-target{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);
  border-radius:7px;color:var(--navy);background:var(--paper)}
.trash-target.ready{outline:2px solid var(--gold);outline-offset:2px}
.trash-target.over{background:var(--gold)}
.filter{justify-content:flex-start;margin-bottom:14px}
input:not([type=checkbox]),select,textarea{border:1px solid #a6a39b;border-radius:6px;background:#fffdf8;padding:.5rem .6rem;max-width:100%}
dialog{border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);width:min(520px,calc(100% - 26px));padding:22px}
dialog::backdrop{background:#0d1f3788}
form{display:grid;gap:12px}
form label{display:grid;gap:4px;font-weight:650}
form label[hidden]{display:none}
textarea{min-height:150px;resize:vertical}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:.8rem 0}
#status:not(:empty){position:fixed;bottom:18px;right:18px;background:var(--navy);color:white;padding:10px 16px;border-radius:8px;z-index:2}
@media(max-width:1100px){body{grid-template-columns:175px minmax(0,1fr)}.dash{grid-template-columns:1fr}}
@media(max-width:600px){body{display:block}.sidebar{position:static;height:auto;padding:10px}.brand{margin-bottom:6px}nav{display:flex;flex-wrap:wrap}nav button{font-size:.875rem;padding:.35rem}}

.test-back{color:inherit;padding:8px 10px}
.test-entry{width:min(100%,640px);margin-bottom:22px;gap:8px}
.test-entry input{width:100%}
.quick-preview{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 8px}
.quick-preview[hidden]{display:none}
.quick-test .date-fields[hidden]{display:none}
.quick-preview strong{color:var(--navy);overflow-wrap:anywhere}
.test-buttons{display:flex;gap:6px;margin-left:auto}
.test-buttons button{padding:.25rem .65rem}
.test-columns{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.test-examples{display:grid;gap:8px;margin-top:12px}
.test-examples button{text-align:left}
@media(max-width:850px){.test-columns{grid-template-columns:1fr}}

.demo-toolbar{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px clamp(18px,3.5vw,52px);background:#e8e1d1;font-size:.875rem}
.demo-toolbar strong{color:var(--navy)}
.demo-toolbar button{padding:.22rem .55rem}
body{grid-template-rows:auto 1fr}.sidebar{grid-row:1/3}main{grid-column:2}
.demo-popup{position:fixed;z-index:3;bottom:18px;right:18px;width:min(350px,calc(100vw - 36px));border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:0 5px 20px #0d1f3740;border-bottom:4px solid var(--gold)}
.demo-popup[hidden]{display:none}
.demo-popup>div{background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;padding:6px 12px}
.demo-popup button{color:white;background:transparent;border:0;padding:0 8px}
.demo-popup strong,.demo-popup small{display:block;padding:0 14px;overflow-wrap:anywhere}
.demo-popup strong{padding-top:10px}.demo-popup small{padding-bottom:10px}
</style>

</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="brand-icon" aria-hidden="true">▤</span> 업무 데스크</div>
  <nav aria-label="업무 메뉴">
    <button data-page="today"><span aria-hidden="true">☑</span> 오늘 할 일</button>
    <button data-page="calendar"><span aria-hidden="true">▦</span> 월간 캘린더</button>
    <button data-page="templates"><span aria-hidden="true">▧</span> 업무 양식함</button>
    <button data-page="notes"><span aria-hidden="true">▤</span> 월간 메모</button>
    <button data-page="settings"><span aria-hidden="true">⚙</span> 설정</button>
  </nav>
</aside>
<section class="demo-toolbar" aria-label="시연 설정">
  <strong>보고용 시연</strong><span id="demo-clock"></span>
  <button type="button" id="demo-hour">+1시간</button>
  <button type="button" id="demo-day">다음 날</button>
  <button type="button" id="demo-alert" data-test>알림 미리보기</button>
  <button type="button" id="demo-reset">시연 초기화</button>
</section><main id="workspace"><p>업무를 불러오는 중입니다.</p></main>
<div id="status" role="status" aria-live="polite"></div>
<dialog id="editor"></dialog>
<aside id="demo-popup" class="demo-popup" role="status" hidden>
  <div><span>업무 데스크</span><button type="button" aria-label="알림 닫기">×</button></div>
  <strong></strong><small></small>
</aside><script>
"use strict";
const demo = (() => {
  const key = "workdesk-report-demo-v1";
  const now = new Date();
  now.setHours(9, 0, 0, 0);
  const dayKey = offset => {
    const date = new Date(now);
    date.setDate(date.getDate() + offset);
    return [date.getFullYear(), date.getMonth()+1, date.getDate()].map(value => String(value).padStart(2,"0")).join("-");
  };
  const seed = () => {
    const today = dayKey(0);
    return {tasks:[
      {id:"sample-1",title:"회의 자료 검토",memo:"안건과 참석자 수 확인",created:today,date:"",time:"",origin:"tasks"},
      {id:"sample-2",title:"시연 자료 준비",created:today,date:"",time:"",origin:"tasks",starredAt:now.getTime()},
      {id:"sample-3",title:"회의실 확인",created:today,date:"",time:"",origin:"tasks",done:true,completed:today},
      {id:"sample-4",title:"프로젝트 일정 점검",created:today,date:today,time:"10:05",origin:"calendar",memo:"회의 안건 공유"},
      {id:"sample-5",title:"자료 정리 기간",created:today,startDate:today,date:dayKey(2),time:"",origin:"calendar"}
    ],routines:[
      {id:"sample-r1",title:"메일 확인",start:today,repeat:"daily"},
      {id:"sample-r2",title:"주간보고",start:today,repeat:"weekly",weekday:"5"},
      {id:"sample-r3",title:"월간 실적 확인",start:today,repeat:"monthly",dayOfMonth:"25"}
    ],templates:[
      {id:"sample-t1",title:"자료 요청 메일",category:"메일",body:"안녕하세요.\n회의 준비를 위해 [요청 자료]를 [회신 기한]까지 공유해 주세요.\n감사합니다."}
    ],notes:[
      {id:"sample-n1",title:"보고 준비 메모",body:"예시 프로젝트의 진행 상황과 다음 일정을 정리합니다.",month:today.slice(0,7),carry:true}
    ],weekends:true};
  };
  let state = seed();
  try {
    const saved = localStorage.getItem(key);
    if (saved) state = JSON.parse(saved);
  } catch {}
  let revision = 0;
  const lastStar = new Map();
  const sent = new Set();
  const popup = document.querySelector("#demo-popup");
  let timer;
  const show = (title, caption) => {
    popup.querySelector("strong").textContent = title;
    popup.querySelector("small").textContent = caption;
    popup.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(() => {popup.hidden = true;}, 10000);
  };
  popup.querySelector("button").onclick = () => {popup.hidden = true;};
  const clock = document.querySelector("#demo-clock");
  const redrawClock = () => {clock.textContent = dayKey(0) + " " + now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});};
  redrawClock();
  const response = () => ({ok:true,json:async () => ({data:structuredClone(state),revision})});
  const request = async (path, options = {}) => {
    if (path === "/api/state" && options.method === "PUT") {
      state = JSON.parse(options.body).data;
      revision++;
      try {localStorage.setItem(key,JSON.stringify(state));} catch {}
      return response();
    }
    if (path === "/api/state") return response();
    if (path === "/api/test") {
      show("회의 자료 검토","시연용 팝업");
      return {ok:true};
    }
    throw new Error("Demo route");
  };
  const advance = hours => {
    const before = now.getTime();
    now.setHours(now.getHours() + hours);
    redrawClock();
    const results = [];
    const current = dayKey(0);
    for (const item of state.tasks) {
      if (item.done) continue;
      const due = item.date || item.created;
      if (item.starredAt && (item.startDate || due) <= current &&
          (due >= current || state.weekends || (now.getDay() >= 1 && now.getDay() <= 5)) &&
          now.getTime() - Math.max(item.starredAt,lastStar.get(item.id) || 0) >= 3600000) {
        results.push(item.title);
        lastStar.set(item.id,now.getTime());
      }
      if (!item.date) continue;
      const alertAt = new Date(item.date + "T" + (item.time || "07:30")).getTime() - (item.time ? 300000 : 0);
      const id = item.id + "/261124/" + alertAt;
      if (before < alertAt && alertAt <= now.getTime() && !sent.has(id)) {
        if (!results.includes(item.title)) results.push(item.title);
        sent.add(id);
      }
    }
    if (results.length) show(results[0],results.length === 1 ? "시연용 업무 알림" : "시연용 업무 알림 · 외 " + (results.length-1) + "건");
  };
  const copy = async text => {
    if (navigator.clipboard?.writeText) {
      try { await navigator.clipboard.writeText(text); return; } catch {}
    }
    const field = document.createElement("textarea");
    field.value = text;
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.append(field);
    field.select();
    try {if (!document.execCommand("copy")) throw new Error("copy");}
    finally {field.remove();}
  };
  document.querySelector("#demo-reset").onclick = () => {
    if (!confirm("시연용 기록을 초기화할까요?")) return;
    try {localStorage.removeItem(key);} catch {}
    location.reload();
  };
  return {request,advance,copy,now:() => new Date(now)};
})();

"use strict";

const workspace = document.querySelector("#workspace");
const editor = document.querySelector("#editor");
const status = document.querySelector("#status");
const categories = ["메일", "보고", "기타"];
const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
let data, revision, statusTimer;
let saving = false;
let page = "today";
let filter = {text: "", category: ""};
let noteFilter = {text: "", month: ""};
const dateKey = (date = demo.now()) => [date.getFullYear(), date.getMonth() + 1, date.getDate()]
  .map(value => String(value).padStart(2, "0")).join("-");
const parseDate = key => new Date(key + "T12:00:00");
const isWeekday = date => date.getDay() >= 1 && date.getDay() <= 5;
let today = dateKey();
let selected = today;
let month = parseDate(today);
let rangeDrag;
let suppressDateClickUntil = 0;
let draggedTask;
const taskEnd = item => item.date || item.created;
const taskStart = item => item.startDate || taskEnd(item);
const isPeriod = item => taskStart(item) < taskEnd(item);
const isCalendarTask = item => item.origin === "calendar" || (!item.origin && isPeriod(item));

const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);
const shortDate = key => parseDate(key).toLocaleDateString("ko-KR", {month:"long", day:"numeric"});
const longDate = key => parseDate(key).toLocaleDateString("ko-KR", {
  year:"numeric", month:"long", day:"numeric", weekday:"long"
});

function message(text) {
  status.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { status.textContent = ""; }, 4500);
}

async function load() {
  const response = await demo.request("/api/state", {cache:"no-store"});
  if (!response.ok) throw new Error("load");
  ({data, revision} = await response.json());
  data.notes ??= [];
  render();
}

async function change(update) {
  if (saving) {
    message("저장이 끝난 뒤 다시 시도해 주세요.");
    return false;
  }
  saving = true;
  const next = structuredClone(data);
  update(next);
  try {
    const response = await demo.request("/api/state", {
      method:"PUT", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data:next, revision})
    });
    if (response.status === 409) {
      await load();
      message("다른 탭에서 변경한 내용을 불러왔어요. 다시 시도해 주세요.");
      return false;
    }
    if (!response.ok) throw new Error("save");
    ({data, revision} = await response.json());
    data.notes ??= [];
    render();
    return true;
  } catch {
    render();
    message("저장하지 못했어요. 다시 시도해 주세요.");
    return false;
  } finally {
    saving = false;
  }
}

function monthlyOccurrence(year, month, dayOfMonth) {
  const monthEnd = new Date(year, month + 1, 0);
  if (dayOfMonth > monthEnd.getDate()) {
    while (!isWeekday(monthEnd)) monthEnd.setDate(monthEnd.getDate() - 1);
    return dateKey(monthEnd);
  }
  const date = new Date(year, month, dayOfMonth);
  while (!isWeekday(date)) date.setDate(date.getDate() + 1);
  return dateKey(date);
}

function latestOccurrence(item, day) {
  const date = parseDate(day);
  if (item.repeat === "monthly") {
    for (let offset = 0; offset < 3; offset++) {
      const occurrence = monthlyOccurrence(date.getFullYear(), date.getMonth() - offset, Number(item.dayOfMonth));
      if (occurrence >= item.start && occurrence <= day) return occurrence;
    }
    return null;
  }
  do {
    if (dateKey(date) < item.start) return null;
    if (isWeekday(date) && (item.repeat === "daily" || date.getDay() === Number(item.weekday))) {
      return dateKey(date);
    }
    date.setDate(date.getDate() - 1);
  } while (true);
}

function todayTasks() {
  return data.tasks.filter(item => {
    const due = item.date || item.created;
    return item.done ? item.completed === today :
      (taskStart(item) <= today && today <= due) ||
      (due < today && (data.weekends || isWeekday(parseDate(today))));
  }).sort((left, right) => Number(Boolean(left.done)) - Number(Boolean(right.done)) ||
    (left.date || left.created).localeCompare(right.date || right.created) ||
    (left.time || "07:30").localeCompare(right.time || "07:30"));
}

function taskRow(item, showStar = false) {
  const details = [];
  if (item.date) {
    const dates = isPeriod(item) ? shortDate(taskStart(item)) + " ~ " + shortDate(item.date) : shortDate(item.date);
    details.push((!item.done && item.date < today ? "기한 지남 · " : "") + dates);
    if (!item.done && item.date >= today) details.push(item.time ? item.time + " · 5분 전 알림" : "07:30 알림");
    else if (item.time) details.push(item.time);
  }
  return `<div class="row ${item.done ? "done" : ""}">
    <span class="task-grip" draggable="true" data-drag-task="${item.id}" title="휴지통으로 끌어 삭제" aria-hidden="true">⠿</span>
    <input type="checkbox" data-check="tasks" data-id="${item.id}" aria-label="${escapeHtml(item.title)} 완료" ${item.done ? "checked" : ""}>
    <div><strong>${escapeHtml(item.title)}</strong>${details.length ? `<small>${details.join(" · ")}</small>` : ""}
    ${item.memo ? `<small class="memo-text">${escapeHtml(item.memo)}</small>` : ""}</div>
    ${showStar ? `<button class="quiet task-star" data-star="${item.id}" aria-pressed="${Boolean(item.starredAt)}"
      aria-label="${escapeHtml(item.title)} 시간당 알림" title="미완료 상태에서 한 시간마다 알림">${item.starredAt ? "★" : "☆"}</button>` : ""}
    <button class="quiet" data-edit="tasks" data-id="${item.id}">수정</button>
  </div>`;
}

function routineRow(item, checked) {
  const repeatLabel = item.repeat === "monthly" ? "매월 " + item.dayOfMonth + "일" :
    item.repeat === "daily" ? "평일 매일" : "매주 " + weekdays[item.weekday] + "요일";
  return `<div class="row ${checked ? "done" : ""}">
    <input type="checkbox" data-check="routines" data-id="${item.id}" aria-label="${escapeHtml(item.title)} 완료" ${checked ? "checked" : ""}>
    <div><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(repeatLabel)}</small></div>
    <button class="quiet" data-edit="routines" data-id="${item.id}">수정</button>
  </div>`;
}

const trash = `<span class="trash-target" data-trash title="할 일을 여기에 끌어 놓으면 삭제" aria-label="휴지통" role="img">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path d="M4 6h16M9 6V3h6v3m3 0-1 15H7L6 6m4 4v7m4-7v7"/>
  </svg></span>`;

function weekPeriods(days, periods) {
  const first = days.find(Boolean), last = days.findLast(Boolean);
  const occupied = [];
  return periods.filter(item => taskStart(item) <= last && taskEnd(item) >= first).map(item => {
    const start = days.findIndex(key => key && key >= taskStart(item));
    const end = days.findLastIndex(key => key && key <= taskEnd(item));
    let lane = occupied.findIndex(column => column < start);
    if (lane < 0) lane = occupied.length;
    occupied[lane] = end;
    return {item, start, end, lane};
  });
}

function calendar() {
  const year = month.getFullYear(), number = month.getMonth();
  const first = new Date(year, number, 1).getDay();
  const last = new Date(year, number + 1, 0).getDate();
  const days = Array(first).fill("");
  for (let day = 1; day <= last; day++) {
    days.push(dateKey(new Date(year, number, day)));
  }
  const lastInMonth = days.at(-1);
  for (let day = 1; days.length % 7; day++) {
    days.push(dateKey(new Date(year, number + 1, day)));
  }
  const calendarTasks = data.tasks.filter(isCalendarTask);
  const periods = calendarTasks.filter(isPeriod).sort((a,b) => taskStart(a).localeCompare(taskStart(b)));
  const weeks = [];
  for (let index = 0; index < days.length; index += 7) {
    const week = days.slice(index, index + 7);
    const bars = weekPeriods(week, periods);
    const lanes = Math.max(0, ...bars.map(bar => bar.lane + 1));
    const cells = week.map(key => {
      if (!key) return '<span class="day-blank"></span>';
      const day = Number(key.slice(-2));
      const nextMonth = key > lastInMonth;
      const entries = calendarTasks.filter(item => !isPeriod(item) && taskEnd(item) === key)
        .sort((a,b) => (a.time || "").localeCompare(b.time || ""));
      const count = entries.length + bars.filter(bar => taskStart(bar.item) <= key && key <= taskEnd(bar.item)).length;
      return `<button class="day-cell${nextMonth ? " next-month-day" : ""}" data-date="${key}"
        aria-label="${nextMonth ? shortDate(key) : day + "일"}, 일정 ${count}건" aria-pressed="${selected === key}">
        <span class="day-number">${day}</span><span class="day-entries">${entries.map(item => `<span class="event">
          <span>${escapeHtml((item.time ? item.time + " " : "") + item.title)}</span>
          ${item.memo ? `<span class="event-memo">${escapeHtml(item.memo)}</span>` : ""}
        </span>`).join("")}</span></button>`;
    });
    weeks.push(`<div class="calendar-week" data-lanes="${lanes}">${cells.join("")}
      <div class="period-lanes">${bars.map(({item,start,end,lane}) => `<button class="period-bar"
        data-edit="tasks" data-id="${item.id}" data-columns="${start + 1}/${end + 2}" data-lane="${lane + 1}"
        title="${escapeHtml(item.title)} · ${escapeHtml(taskStart(item))} ~ ${escapeHtml(taskEnd(item))}">
        ${escapeHtml(item.title)}</button>`).join("")}</div></div>`);
  }
  return `<section class="panel calendar-panel">
    <div class="between"><h2>${year}년 ${number + 1}월 캘린더</h2><div class="calendar-actions">
      <button data-edit="tasks" data-origin="calendar">+ 일정 추가</button>
      <button data-month="-1" aria-label="이전 달">‹</button> <button data-month="1" aria-label="다음 달">›</button></div></div>
    <div class="calendar-scroll">
    <div class="week">${weekdays.map(day => `<span>${day}</span>`).join("")}</div>
    <div class="calendar-grid">${weeks.join("")}</div></div>
  </section>`;
}

function notesForHome(day) {
  const monthKey = day.slice(0, 7);

  return data.notes.filter(item => item.month === monthKey ||

function quickDate(value, year = demo.now().getFullYear()) {
  if (!/^\d{4}$/.test(value)) return "";
  const key = year + "-" + value.slice(0, 2) + "-" + value.slice(2);
  return dateKey(parseDate(key)) === key ? key : "";
}

function quickTime(value) {
  const digits = value.match(/^(\d{2})(?::?)(\d{2})$/);
  const words = value.match(/^(?:(오전|오후)\s*)?(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?$/);
  if (!digits && !words) return "";
  let hour = Number(digits ? digits[1] : words[2]);
  const minute = Number(digits ? digits[2] : words[3] || 0);
  if (words?.[1]) {
    if (hour < 1 || hour > 12) return "";
    hour = hour % 12 + (words[1] === "오후" ? 12 : 0);
  }
  if (hour > 23 || minute > 59) return "";
  return [hour, minute].map(value => String(value).padStart(2, "0")).join(":");
}

function openEditor(type, id, range, origin = "tasks") {
  const item = data[type].find(entry => entry.id === id);
  const calendarEntry = type === "tasks" && (origin === "calendar" || (item && isCalendarTask(item)));
  const typeName = {tasks:calendarEntry ? "일정" : "할 일", routines:"고정 업무", templates:"업무 양식", notes:"월간 메모"}[type];
  const fields = {
    tasks:`<div class="date-fields"><label>날짜 / 종료일<input name="date" type="date" value="${escapeHtml(range?.end ?? item?.date ?? (calendarEntry ? selected : ""))}"></label>
      <label>날짜 빠른 입력<input name="fastDate" inputmode="numeric" maxlength="4" placeholder="예: 1130"></label></div>
      <label>기간 시작일<input name="startDate" type="date" value="${escapeHtml(range?.start ?? item?.startDate ?? "")}"></label>
      <div class="date-fields"><label>시간<input name="time" type="time" value="${escapeHtml(item?.time)}"></label>
      <label>시간 빠른 입력<input name="fastTime" maxlength="20" placeholder="예: 1010, 10시 10분"></label></div>
      <small>날짜를 비우면 오늘로 등록돼요. 날짜만 지정하면 오전 7시 30분, 시간을 지정하면 5분 전에 알림이 떠요. 기간 일정 알림은 종료일 기준이에요.</small>
      <label>일정 메모<textarea name="memo" class="short-memo" maxlength="1000">${escapeHtml(item?.memo)}</textarea></label>`,
    routines:`<label>반복<select name="repeat"><option value="daily">평일 매일</option>
      <option value="weekly" ${item?.repeat === "weekly" ? "selected" : ""}>매주</option>
      <option value="monthly" ${item?.repeat === "monthly" ? "selected" : ""}>매월</option></select></label>
      <label id="weekday-label">요일<select name="weekday">${weekdays.slice(1,6).map((day,index) =>
        `<option value="${index + 1}" ${Number(item?.weekday) === index + 1 ? "selected" : ""}>${day}요일</option>`).join("")}</select></label>
      <label id="month-day-label">매월 날짜<input type="number" name="dayOfMonth" min="1" max="31" step="1" required value="${escapeHtml(item?.dayOfMonth ?? demo.now().getDate())}">
      <small>주말이면 다음 근무일, 그달에 없는 날짜면 마지막 근무일에 표시해요.</small></label>`,
    templates:`<label>분류<select name="category">${categories.map(category => `<option ${item?.category === category ? "selected" : ""}>${category}</option>`).join("")}</select></label>
      <label>본문<textarea name="body" maxlength="25000" required>${escapeHtml(item?.body)}</textarea></label>`,
    notes:`<label>본문<textarea name="body" maxlength="25000" required>${escapeHtml(item?.body)}</textarea></label>
      <label class="note-carry"><input name="carry" type="checkbox" ${item?.carry ? "checked" : ""}> 다음 달 첫 7일에도 표시</label>`
  };
  editor.innerHTML = `<form><h2>${typeName} ${item ? "수정" : "추가"}</h2>
    <label>제목<input name="title" value="${escapeHtml(item?.title)}" required maxlength="120" autofocus></label>${fields[type]}
    <div class="actions"><div>${item ? '<button type="button" data-delete>삭제</button>' : ""}</div><div>
      <button type="button" data-cancel>취소</button> <button class="primary" type="submit">저장</button>
    </div></div></form>`;
  const form = editor.querySelector("form");
  if (type === "tasks") {
    for (const [quick, native, parse, example] of [
      ["fastDate", "date", quickDate, "날짜를 1130처럼 입력해 주세요."],
      ["fastTime", "time", quickTime, "시간을 1010 또는 10시 10분처럼 입력해 주세요."]
    ]) {
      const shortcut = form.elements[quick], picker = form.elements[native];
      shortcut.addEventListener("input", () => {
        const value = shortcut.value.trim();
        const result = value ? parse(value) : "";
        shortcut.setCustomValidity(value && !result ? example : "");
        picker.value = result;
      });
      picker.addEventListener("input", () => {
        shortcut.value = "";
        shortcut.setCustomValidity("");
      });
    }
  }
  if (type === "routines") {
    const toggleDay = () => {
      const repeat = form.elements.repeat.value;
      editor.querySelector("#weekday-label").hidden = repeat !== "weekly";
      editor.querySelector("#month-day-label").hidden = repeat !== "monthly";
      form.elements.dayOfMonth.disabled = repeat !== "monthly";
    };
    form.elements.repeat.addEventListener("change", toggleDay);
    toggleDay();
  }
  editor.querySelector("[data-cancel]").onclick = () => editor.close();
  const remove = editor.querySelector("[data-delete]");
  if (remove) remove.onclick = async () => {
    if (confirm("이 항목을 삭제할까요?") && await change(next => {
      next[type] = next[type].filter(entry => entry.id !== id);
    })) editor.close();
  };
  form.onsubmit = async event => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(form));
    fields.title = fields.title.trim();
    if (!fields.title) return message("제목을 입력해 주세요.");
    if (type === "tasks") {
      delete fields.fastDate;
      delete fields.fastTime;
      if (fields.startDate && (!fields.date || fields.startDate > fields.date)) {
        const end = form.elements.date;
        end.setCustomValidity("시작일과 같거나 그 이후의 종료일을 지정해 주세요.");
        end.reportValidity();
        end.setCustomValidity("");
        return;
      }
      if (fields.startDate === fields.date) fields.startDate = "";
      if (fields.time && !fields.date) fields.date = dateKey();
      if (!fields.date && (!item || item.date)) fields.created = dateKey();
      fields.origin = calendarEntry ? "calendar" : "tasks";
    }
    if ((type === "templates" || type === "notes") && !fields.body.trim()) return message("본문을 입력해 주세요.");
    if (type === "notes") {
      fields.month = item?.month ?? dateKey().slice(0, 7);
      fields.carry = form.elements.carry.checked;
    }
    if (await change(next => {
      if (item) {
        const entry = next[type].find(candidate => candidate.id === id);
        if (type === "routines" && (entry.repeat !== fields.repeat ||
            (fields.repeat === "weekly" && entry.weekday !== fields.weekday) ||
            (fields.repeat === "monthly" && entry.dayOfMonth !== fields.dayOfMonth))) {
          Object.assign(entry, {start:today, checkedOn:"", completedOccurrence:""});
        }
        Object.assign(entry, fields);
      } else {
        next[type].unshift({id:crypto.randomUUID(), created:today, start:today, ...fields});
      }
    })) {
      editor.close();
      message("저장했어요.");
    }
  };
  editor.showModal();
}

document.addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button || !data) return;
  const action = button.dataset;
  if (action.page) {
    if (action.page === "today" && page !== "today") noteFilter = {text:"", month:""};
    page = action.page;
    render();
  }
  if (action.edit) openEditor(action.edit, action.id, undefined, action.origin);
  if (action.star) await change(next => {
    const item = next.tasks.find(entry => entry.id === action.star);
    item.starredAt = item.starredAt ? 0 : demo.now().getTime();
  });
  if (action.month) {
    month = new Date(month.getFullYear(), month.getMonth() + Number(action.month), 1);
    selected = dateKey(month);
    render();
  }
  if (action.date && (event.detail === 0 || performance.now() >= suppressDateClickUntil)) {
    selected = action.date; page = "calendar"; render();
  }
  if (action.copy) {
    try {
      await demo.copy(data.templates.find(item => item.id === action.copy).body);
      message("본문을 복사했어요.");
    } catch { message("복사하지 못했어요. 본문을 선택해 복사해 주세요."); }
  }
  if ("test" in action) {
    try {
      const response = await demo.request("/api/test", {method:"POST", headers:{"Content-Type":"application/json"}});
      if (!response.ok) message("테스트 알림을 보낼 수 없어요.");
    } catch { message("테스트 알림을 보낼 수 없어요."); }
  }
});

function dateAtPointer(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const week = hit?.closest(".calendar-week");
  if (!week) return "";
  const cell = hit.closest("[data-date]");
  if (cell) return cell.dataset.date;
  const bounds = week.getBoundingClientRect();
  const column = Math.floor((event.clientX - bounds.left) * 7 / bounds.width);
  return week.children[column]?.dataset.date || "";
}

document.addEventListener("pointerdown", event => {
  const cell = event.target.closest("[data-date]");
  if (!cell || event.button !== 0 || event.pointerType === "touch") return;
  rangeDrag = {pointer:event.pointerId, start:cell.dataset.date, end:cell.dataset.date};
  suppressDateClickUntil = 0;
});

document.addEventListener("pointermove", event => {
  if (rangeDrag?.pointer !== event.pointerId) return;
  const end = dateAtPointer(event);
  if (!end || end === rangeDrag.end) return;
  rangeDrag.end = end;
  const [first, last] = [rangeDrag.start, end].sort();
  workspace.querySelectorAll("[data-date]").forEach(cell => {
    cell.classList.toggle("range-preview", first !== last && first <= cell.dataset.date && cell.dataset.date <= last);
  });
});

function clearRange() {
  rangeDrag = undefined;
  workspace.querySelectorAll(".range-preview").forEach(cell => cell.classList.remove("range-preview"));
}

document.addEventListener("pointerup", event => {
  if (rangeDrag?.pointer !== event.pointerId) return;
  const [start, end] = [rangeDrag.start, dateAtPointer(event) || rangeDrag.end].sort();
  clearRange();
  if (start !== end) {
    suppressDateClickUntil = performance.now() + 500;
    openEditor("tasks", undefined, {start, end}, "calendar");
  }
});
document.addEventListener("pointercancel", clearRange);
window.addEventListener("blur", clearRange);

function resetTaskDrag() {
  draggedTask = undefined;
  workspace.querySelector("[data-trash]")?.classList.remove("ready", "over");
}
document.addEventListener("dragstart", event => {
  const grip = event.target.closest("[data-drag-task]");
  if (!grip) return;
  draggedTask = grip.dataset.dragTask;
  event.dataTransfer.setData("text/plain", draggedTask);
  event.dataTransfer.effectAllowed = "move";
  const row = grip.closest(".row");
  event.dataTransfer.setDragImage(row, 12, row.offsetHeight / 2);
  workspace.querySelector("[data-trash]")?.classList.add("ready");
});
document.addEventListener("dragover", event => {
  const target = event.target.closest("[data-trash]");
  if (!target || !draggedTask) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  target.classList.add("over");
});
document.addEventListener("dragleave", event => {
  const target = event.target.closest("[data-trash]");
  if (target && !target.contains(event.relatedTarget)) target.classList.remove("over");
});
document.addEventListener("dragend", resetTaskDrag);
document.addEventListener("drop", async event => {
  if (!event.target.closest("[data-trash]") || !draggedTask) return;
  event.preventDefault();
  const id = draggedTask;
  resetTaskDrag();
  if (await change(next => { next.tasks = next.tasks.filter(item => item.id !== id); })) {
    message("할 일을 삭제했어요.");
  }
});

document.addEventListener("input", event => {
  if (event.target.id === "search") { filter.text = event.target.value; renderTemplates(); }
  if (event.target.id === "note-search") { noteFilter.text = event.target.value; renderNotes(); }
});

document.addEventListener("change", async event => {
  const input = event.target;
  if (input.id === "category-filter") { filter.category = input.value; renderTemplates(); }
  if (input.id === "note-month") { noteFilter.month = input.value; renderNotes(); }
  if (input.dataset.carry) await change(next => {
    next.notes.find(item => item.id === input.dataset.carry).carry = input.checked;
  });
  if (input.id === "weekends") await change(next => { next.weekends = input.checked; });
  const type = input.dataset.check;
  if (!type) return;
  await change(next => {
    const item = next[type].find(entry => entry.id === input.dataset.id);
    if (type === "tasks") {
      item.done = input.checked;
      item.completed = input.checked ? today : "";
      if (!input.checked && item.starredAt) item.starredAt = demo.now().getTime();
    } else {
      item.checkedOn = input.checked ? today : "";
      item.completedOccurrence = input.checked ? latestOccurrence(item, today) : "";
    }
  });
});

function refreshDay() {
  if (!data || today === dateKey()) return;
  const previous = today;
  today = dateKey();
  if (selected === previous) { selected = today; month = parseDate(today); }
  render();
}
setInterval(refreshDay, 15000);
document.addEventListener("visibilitychange", refreshDay);
load().catch(() => {
  workspace.innerHTML = heading("업무 데스크") + '<p>업무 데스크를 다시 실행한 뒤 이 페이지를 새로고침해 주세요.</p>';
});

document.querySelector("#demo-hour").onclick = () => {demo.advance(1); refreshDay();};
document.querySelector("#demo-day").onclick = () => {demo.advance(24); refreshDay();};</script></body>
</html>
