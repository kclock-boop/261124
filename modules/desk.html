<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 데스크</title><link rel="stylesheet" href="/261124/desk.css"><script type="module" src="/261124/desk.js"></script></head>
<body>
<main>
  <header><div><h1>업무 데스크</h1><p>할 일과 일정을 확인하고 필요한 문구를 찾아 쓰세요.</p></div><button class="primary" id="new-event">일정 등록</button></header>
  <nav aria-label="업무 데스크 메뉴"><button type="button" data-view="today">오늘 할 일</button><button type="button" data-view="calendar">월간 캘린더</button><button type="button" data-view="memos">월간 메모</button><button type="button" data-view="snippets">업무 양식함</button></nav>
  <section id="today" class="grid">
    <article><h2>오늘 할 일</h2><form id="quick"><label class="sr" for="quick-title">할 일 제목</label><input required maxlength="120" id="quick-title" placeholder="할 일 제목"><button class="primary">추가</button></form><ul id="tasks"></ul><label class="check"><input id="weekend" type="checkbox"> 날짜 없는 미완료 업무를 주말에도 표시</label></article>
    <article><div class="row"><h2>반복 업무</h2><button id="new-rule" type="button">반복 업무 등록</button></div><ul id="rules"></ul></article>
  </section>
  <section id="calendar" hidden>
    <article><div class="row"><div class="row"><button id="prev" aria-label="이전 달">‹</button><h2 id="month-name"></h2><button id="next" aria-label="다음 달">›</button></div><div class="row"><button id="current-month">이번 달</button><button id="enable-notifications">알림 허용</button></div></div><p class="helper">날짜를 눌러 일정을 등록하거나 시작일에서 종료일까지 드래그하세요.</p><div class="calendar" id="days"></div><ul id="events"></ul></article>
  </section>
  <section id="memos" hidden>
    <article><div class="row"><h2>월간 메모</h2><button id="new-memo" class="primary">메모 추가</button></div><div class="search"><input id="memo-search" aria-label="제목 또는 본문 검색" placeholder="제목·본문 검색"><input type="month" id="memo-month" aria-label="메모 작성 월"></div><ul id="memo-list"></ul></article>
  </section>
  <section id="snippets" hidden>
    <article><div class="row"><h2>업무 양식함</h2><button id="new-snippet" class="primary">문구 추가</button></div><input id="snippet-search" aria-label="제목 또는 분류 검색" placeholder="제목·분류 검색"><ul id="snippet-list"></ul></article>
  </section>
  <p id="message" role="status"></p>
</main>
<dialog id="editor" aria-labelledby="editor-heading">
  <form id="edit-form">
    <div class="row"><h2 id="editor-heading">등록</h2><button id="close" type="button" aria-label="닫기">×</button></div>
    <div id="fields"></div>
    <p id="editor-error" role="alert"></p>
    <div class="row actions"><button type="button" id="cancel">취소</button><button class="primary">저장</button></div>
  </form>
</dialog>
</body></html>
