<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모양 · 이모티콘 제작기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3fc;color:#211d36;font:16px system-ui,sans-serif}header{background:white;border-bottom:1px solid #e3dff3}.top,main{max-width:1240px;margin:auto;padding:18px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:21px}.mark{background:#6242db;color:white;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}.intro{margin:28px 0 24px}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.06em;margin:0}p{color:#625b77;margin:8px 0;line-height:1.5}.grid{display:grid;grid-template-columns:220px minmax(320px,1fr) 250px;gap:16px;align-items:start}.card{background:white;border:1px solid #e3dff3;border-radius:22px;padding:18px}h2{font-size:17px;margin:0 0 14px}button,input,select{font:inherit}button,.file{cursor:pointer;border:1px solid #e1dcf1;background:white;border-radius:10px;padding:9px 12px;color:inherit;font-weight:650;text-align:center;font-size:14px}button:hover,.file:hover{background:#f0ebff}button[aria-pressed=true]{background:#ebe3ff;border-color:#8666ec;color:#4725ac}.primary{background:#5b38d3;color:white;border-color:#5b38d3}.primary:hover{background:#4828b6}.file{display:block}label.field{display:grid;gap:7px;margin-top:14px;font-size:14px;font-weight:650}input[type=text],select{width:100%;border:1px solid #ded8ee;border-radius:8px;padding:9px;color:inherit;background:white}input[type=range]{width:100%;accent-color:#6242db}input[type=color]{width:100%;height:34px;border:1px solid #e1dcf1;border-radius:8px;background:white}.row{display:flex;gap:8px;flex-wrap:wrap}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar h2{margin:0}.work{background:#efedf8;border-radius:14px;padding:24px;display:grid;place-items:center}.checker{background:conic-gradient(#eeeaf7 25%,white 0 50%,#eeeaf7 0 75%,white 0) 0 0/20px 20px;border-radius:8px;width:min(100%,360px);box-shadow:0 4px 20px #2820421a}.checker canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}.chat{background:#e5defb;border-radius:14px;padding:14px;min-height:175px}.chat.dark{background:#302749}.bubble{display:table;background:white;padding:8px 11px;border-radius:2px 12px 12px 12px;font-size:14px}.chat canvas{display:block;width:106px;height:106px;margin:4px 0 0 auto}.preview-switch{margin-top:10px}#frameList canvas{display:block;width:30px;height:30px;background:#f4f0fa;border-radius:4px}.hint,output{font-size:13px;color:#625b77}output{display:block;min-height:20px;margin-top:10px}hr{border:0;border-top:1px solid #eae6f4;margin:18px 0}a{color:#4b2bb3}button:disabled{opacity:.48;cursor:default}button:focus-visible,.file:focus-within,input:focus-visible,select:focus-visible{outline:2px solid #6242db;outline-offset:2px}@media(max-width:900px){.grid{grid-template-columns:205px minmax(0,1fr)}.preview{grid-column:2}}@media(max-width:630px){.top,main{padding:14px}.grid{grid-template-columns:minmax(0,1fr)}.editor{grid-row:1}.preview{grid-column:1}.work{padding:12px}}
</style>
<header><div class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span> 모양</div><button class="primary" id="save">PNG 저장</button></div></header>
<main>
<section class="intro"><h1>이모티콘 제작기</h1><p>직접 그리거나 그림을 불러와 나만의 정지 이모티콘을 만들어 보세요.</p></section>
<div class="grid">
<section class="card" aria-label="편집 도구">
<h2>편집 도구</h2>
<label class="file">이미지 불러오기<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" style="position:absolute;width:1px;height:1px;opacity:0"></label>
<label class="field">캐릭터 몸<select id="costume" disabled><option value="none">원본 사진</option><option value="rabbit">토끼</option><option value="bear">곰</option><option value="cat">고양이</option></select></label>
<p class="hint" id="costumeHint" hidden>사진을 얼굴 틀 안에서 끌어 움직이고 아래 슬라이더로 크기를 맞춰 보세요.</p>
<label class="field">이미지 크기 <input id="scale" type="range" min="20" max="200" value="100" disabled></label>
<hr>
<div class="row" aria-label="캔버스 도구"><button data-tool="pen" aria-pressed="true">펜</button><button data-tool="erase" aria-pressed="false">지우개</button><button data-tool="move" aria-pressed="false" disabled>이미지 이동</button></div>
<label class="field">펜 색상<input id="ink" type="color" value="#372654"></label>
<label class="field">펜·지우개 굵기<input id="width" type="range" min="1" max="48" value="9"></label>
<hr>
<h2>스티커</h2>
<div class="row" id="stickers" aria-label="붙일 스티커">
<button aria-label="하트 붙이기">💜</button><button aria-label="별 붙이기">⭐</button><button aria-label="반짝이 붙이기">✨</button><button aria-label="꽃 붙이기">🌸</button><button aria-label="리본 붙이기">🎀</button><button aria-label="물방울 붙이기">💧</button>
</div>
<label class="field">스티커 크기<input id="stickerSize" type="range" min="20" max="160" value="62" disabled></label>
<div class="row preview-switch"><button data-tool="sticker" aria-pressed="false" disabled>선택·이동</button><button id="removeSticker" disabled>스티커 삭제</button></div>
<hr>
<h2>문구</h2>
<label class="field">내용<input id="caption" type="text" maxlength="30" value="좋아!" placeholder="문구 입력"></label>
<label class="field">글자 크기<input id="fontSize" type="range" min="16" max="90" value="53"></label>
<label class="field">글자 색상<input id="fontColor" type="color" value="#432897"></label>
<label class="field">문구 위치<select id="placement"><option value="top">위</option><option value="middle">가운데</option><option value="bottom" selected>아래</option></select></label>
</section>
<section class="card editor" aria-label="캔버스">
<div class="bar"><h2>작업 캔버스</h2><div class="row"><button id="undo" disabled>실행 취소</button><button id="clear">빈 캔버스</button></div></div>
<div class="work"><div class="checker"><canvas id="art" width="360" height="360" aria-label="360 × 360 그림 캔버스"></canvas></div></div>
<p class="hint">360 × 360 px · 투명 배경</p><output id="notice" role="status"></output>
</section>
<section class="card preview">
<h2>채팅 미리보기</h2><div class="chat" id="chat"><div class="bubble">오늘도 힘내!</div><canvas id="preview" width="180" height="180" aria-label="채팅 속 이모티콘"></canvas></div>
<div class="row preview-switch"><button data-theme="light" aria-pressed="true">밝게</button><button data-theme="dark" aria-pressed="false">어둡게</button></div>
<hr>
<h2>움직이는 이모티콘</h2>
<label class="field">움직임<select id="motion"><option value="bounce">통통 뛰기</option><option value="sway">좌우 흔들기</option><option value="pulse">커졌다 작아지기</option><option value="custom">직접 만든 장면</option></select></label>
<label class="field">재생 속도<select id="speed"><option value="slow">느리게</option><option value="normal" selected>보통</option><option value="fast">빠르게</option></select></label>
<div id="frameControls" hidden>
<p class="hint">그림을 편집한 뒤 장면을 추가하면 순서대로 재생돼요.</p>
<div class="row" id="frameList" aria-label="추가한 장면"></div>
<p class="hint" id="frameCount" aria-live="polite">0 / 24 장면</p>
<div class="row"><button id="addFrame">현재 장면 추가</button><button id="removeFrame" disabled>마지막 장면 삭제</button></div>
</div>
<div class="row preview-switch"><button id="playMotion" aria-pressed="false">재생</button><button class="primary" id="saveGif">채팅용 GIF 저장</button><button id="saveMotion">투명 WebP 저장</button><button id="saveVideo">채팅용 MP4 저장</button></div>
<p class="hint">채팅용 GIF는 흰 배경으로 저장돼요.</p><output id="motionNotice" role="status"></output>
<hr><a class="hint" href="https://emoticonstudio.kakao.com/" target="_blank" rel="noopener noreferrer">카카오 이모티콘 스튜디오</a>
</section>
</div>
</main>
<script>
const byId = id => document.getElementById(id);
const art = byId('art'), ctx = art.getContext('2d');
const preview = byId('preview').getContext('2d');
const paint = document.createElement('canvas');
paint.width = paint.height = 360;
const strokes = paint.getContext('2d', {willReadFrequently:true});
const state = {image:null,x:180,y:165,tool:'pen',pointer:null,importToken:0,sampleOnly:true,stickers:[],selected:-1};
const history = [];
const fields = ['caption','fontSize','fontColor','placement','scale','costume'];
function remember() {
  history.push({pixels:strokes.getImageData(0,0,360,360), image:state.image, x:state.x, y:state.y, sampleOnly:state.sampleOnly,
    stickers:state.stickers.map(sticker=>({...sticker})), selected:state.selected, fields:fields.map(id=>byId(id).value)});
  if (history.length > 24) history.shift();
  byId('undo').disabled = false;
}
function setTool(tool) {
  state.tool = tool;
  document.querySelectorAll('[data-tool]').forEach(button=>{
    button.setAttribute('aria-pressed', button.dataset.tool===tool);
  });
  art.style.cursor = ['move','sticker'].includes(tool) ? 'move' : 'crosshair';
}
function renderCostume(kind) {
  const colors={rabbit:'#c2a2ff',bear:'#eab480',cat:'#83d9cb'};
  const color=colors[kind], outline='#493458';
  ctx.save();
  ctx.lineWidth=6;
  ctx.lineJoin='round';
  function shape(path,fill=color){
    ctx.fillStyle=fill;ctx.strokeStyle=outline;ctx.fill(path);ctx.stroke(path);
  }
  function oval(x,y,rx,ry,angle=0){
    const path=new Path2D();
    path.ellipse(x,y,rx,ry,angle,0,Math.PI*2);
    return path;
  }
  if(kind==='cat'){
    shape(new Path2D('M222 249 Q292 250 278 200 Q289 182 300 201 Q320 262 238 272 Z'));
  }
  shape(oval(180,222,57,58));
  ctx.fillStyle='#fff4ed';
  ctx.fill(oval(180,229,30,36));
  shape(oval(132,223,18,27,.55));shape(oval(228,223,18,27,-.55));
  shape(oval(149,266,25,17,-.18));shape(oval(211,266,25,17,.18));
  if(kind==='rabbit'){
    shape(oval(142,68,18,43,-.26));shape(oval(218,68,18,43,.26));
    ctx.fillStyle='#f399bd';
    ctx.fill(oval(142,67,8,28,-.26));ctx.fill(oval(218,67,8,28,.26));
  }else if(kind==='bear'){
    shape(oval(119,92,25,25));shape(oval(241,92,25,25));
  }else{
    shape(new Path2D('M106 117 Q102 85 119 57 Q144 63 161 94 Z'));
    shape(new Path2D('M254 117 Q258 85 241 57 Q216 63 199 94 Z'));
  }
  shape(oval(180,139,80,68));
  const face=oval(180,139,57,49);
  ctx.fillStyle='#fff4ed';ctx.fill(face);
  ctx.clip(face);
  const image=state.image;
  const factor=Math.max(114/image.width,98/image.height)*Number(byId('scale').value)/100;
  const w=image.width*factor,h=image.height*factor;
  ctx.drawImage(image,state.x-w/2,state.y-26-h/2,w,h);
  ctx.restore();
}
function render() {
  ctx.clearRect(0,0,360,360);
  const costume=byId('costume').value;
  if(state.image && costume!=='none') renderCostume(costume);
  else if (state.image) {
    const factor = 296/Math.max(state.image.width,state.image.height)*Number(byId('scale').value)/100;
    const w=state.image.width*factor, h=state.image.height*factor;
    ctx.drawImage(state.image,state.x-w/2,state.y-h/2,w,h);
  }
  ctx.drawImage(paint,0,0);
  const text=byId('caption').value.trim();
  if (text) {
    const y={top:58,middle:180,bottom:304}[byId('placement').value];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+byId('fontSize').value+'px system-ui, sans-serif';
    ctx.strokeStyle='white'; ctx.lineWidth=8; ctx.lineJoin='round';
    ctx.fillStyle=byId('fontColor').value;
    ctx.strokeText(text,180,y,320); ctx.fillText(text,180,y,320);
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const sticker of state.stickers){
    ctx.font=sticker.size+'px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.fillText(sticker.symbol,sticker.x,sticker.y);
  }
  const selected=state.stickers[state.selected];
  byId('stickerSize').disabled=!selected;
  if(selected) byId('stickerSize').value=selected.size;
  byId('removeSticker').disabled=!selected;
  document.querySelector('[data-tool=sticker]').disabled=!state.stickers.length;
  if(!state.stickers.length && state.tool==='sticker') setTool('pen');
  if(!motionTimer) showPreview(art);
  byId('scale').disabled=!state.image; byId('costume').disabled=!state.image;
  byId('costumeHint').hidden=!state.image || costume==='none';
  document.querySelector('[data-tool=move]').disabled=!state.image;
  if (!state.image && state.tool==='move') setTool('pen');
}
function sample() {
  const blob = new Path2D('M92 165 C72 112 106 76 154 94 C176 82 200 83 218 94 C263 75 290 110 270 151 C292 196 262 241 218 247 C144 263 64 231 92 165 Z');
  strokes.lineWidth=8; strokes.lineJoin='round'; strokes.strokeStyle='#40245b'; strokes.fillStyle='#b993ff';
  strokes.fill(blob); strokes.stroke(blob);
  function oval(x,y,rx,ry,color) {
    strokes.beginPath(); strokes.ellipse(x,y,rx,ry,0,0,Math.PI*2); strokes.fillStyle=color; strokes.fill();
  }
  oval(144,161,9,13,'#40245b'); oval(213,161,9,13,'#40245b');
  oval(124,189,15,8,'#f77dab'); oval(233,189,15,8,'#f77dab');
  strokes.lineWidth=6; strokes.lineCap='round'; strokes.stroke(new Path2D('M163 180 Q179 201 196 180'));
  const shine=new Path2D('M67 102 Q70 84 86 82 Q70 79 67 62 Q64 79 47 82 Q64 84 67 102 Z M289 223 Q292 209 305 206 Q292 203 289 189 Q286 203 273 206 Q286 209 289 223 Z');
  strokes.fillStyle='#ffbd45'; strokes.fill(shine);
}
function point(event) {
  const rect=art.getBoundingClientRect();
  return {x:(event.clientX-rect.left)*360/rect.width,y:(event.clientY-rect.top)*360/rect.height};
}
function draw(from,to) {
  strokes.save();
  strokes.globalCompositeOperation=state.tool==='erase'?'destination-out':'source-over';
  strokes.lineCap='round'; strokes.lineJoin='round';
  strokes.lineWidth=Number(byId('width').value);
  strokes.strokeStyle=byId('ink').value;
  strokes.beginPath(); strokes.moveTo(from.x,from.y);
  strokes.lineTo(to.x+(from.x===to.x && from.y===to.y ? .01:0),to.y);
  strokes.stroke(); strokes.restore();
}
art.addEventListener('pointerdown',event=>{
  if(state.pointer || event.button!==0) return;
  const position=point(event);
  if(state.tool==='sticker'){
    state.selected=state.stickers.findLastIndex(sticker=>
      Math.abs(sticker.x-position.x)<=sticker.size*.55 && Math.abs(sticker.y-position.y)<=sticker.size*.55);
    render();
    if(state.selected<0) return;
  }
  remember();
  state.pointer={id:event.pointerId,position,tool:state.tool};
  art.setPointerCapture(event.pointerId);
  if(['pen','erase'].includes(state.tool)){state.sampleOnly=false;draw(position,position);}
  render();
});
art.addEventListener('pointermove',event=>{
  const active=state.pointer;
  if(active?.id!==event.pointerId) return;
  const next=point(event), previous=active.position;
  if(active.tool==='move'){state.x+=next.x-previous.x;state.y+=next.y-previous.y;}
  else if(active.tool==='sticker'){
    const sticker=state.stickers[state.selected];
    if(sticker){
      sticker.x=Math.max(0,Math.min(360,sticker.x+next.x-previous.x));
      sticker.y=Math.max(0,Math.min(360,sticker.y+next.y-previous.y));
    }
  }else draw(previous,next);
  active.position=next;
  render();
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) art.addEventListener(type,event=>{
  if(state.pointer?.id===event.pointerId) state.pointer=null;
});
document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>setTool(button.dataset.tool));
document.querySelectorAll('[data-theme]').forEach(button=>button.onclick=()=>{
  byId('chat').classList.toggle('dark',button.dataset.theme==='dark');
  document.querySelectorAll('[data-theme]').forEach(item=>item.setAttribute('aria-pressed',item===button));
});
for (const id of fields) {
  const input=byId(id);
  let before=input.value;
  input.addEventListener('input',()=>{
    const next=input.value;
    if(next!==before && input.dataset.editing!=='yes'){
      input.value=before; remember(); input.value=next; input.dataset.editing='yes';
    }
    render();
  });
  function commit(){before=input.value; delete input.dataset.editing;}
  input.addEventListener('change',()=>{
    commit();
    if(id==='costume' && state.image){
      state.x=180; state.y=165;
      byId('scale').value=100; byId('scale').dispatchEvent(new Event('sync'));
      setTool('move'); render();
    }
  });
  input.addEventListener('blur',commit);
  input.addEventListener('sync',commit);
}
byId('undo').onclick=()=>{
  const previous=history.pop();
  if(!previous) return;
  state.importToken++;
  strokes.putImageData(previous.pixels,0,0);
  Object.assign(state,{image:previous.image,x:previous.x,y:previous.y,sampleOnly:previous.sampleOnly,stickers:previous.stickers,selected:previous.selected,pointer:null});
  fields.forEach((id,i)=>{byId(id).value=previous.fields[i];byId(id).dispatchEvent(new Event('sync'));});
  byId('undo').disabled=!history.length;
  byId('notice').textContent='마지막 편집을 취소했어요.';
  render();
};
byId('clear').onclick=()=>{
  remember(); state.importToken++;
  state.image=null; state.sampleOnly=false; state.stickers=[]; state.selected=-1; state.pointer=null; strokes.clearRect(0,0,360,360);
  byId('costume').value='none'; byId('costume').dispatchEvent(new Event('sync'));
  byId('caption').value=''; byId('caption').dispatchEvent(new Event('sync'));
  byId('notice').textContent='빈 캔버스를 준비했어요.';
  render();
};
byId('file').onchange=async event=>{
  const file=event.target.files[0];
  event.target.value='';
  if(!file) return;
  const token=++state.importToken;
  try{
    const image=await createImageBitmap(file);
    if(token!==state.importToken){image.close();return;}
    remember();
    if(state.sampleOnly){strokes.clearRect(0,0,360,360); state.sampleOnly=false;}
    state.image=image; state.x=180; state.y=165;
    byId('scale').value=100; byId('scale').dispatchEvent(new Event('sync'));
    setTool('move'); render();
    byId('notice').textContent='캔버스에서 이미지를 끌어 위치를 조정할 수 있어요.';
  }catch{
    if(token===state.importToken) byId('notice').textContent='이미지를 열 수 없어요. PNG, JPG 또는 WebP 파일을 선택해 주세요.';
  }
};
byId('stickers').onclick=event=>{
  const button=event.target.closest('button');
  if(!button) return;
  remember();
  const offset=(state.stickers.length%5)*12;
  state.stickers.push({symbol:button.textContent.trim(),x:248-offset,y:97+offset,size:62});
  state.selected=state.stickers.length-1;
  setTool('sticker');
  render();
  byId('notice').textContent=button.getAttribute('aria-label').replace(' 붙이기','')+' 스티커를 붙였어요. 캔버스에서 끌어 이동할 수 있어요.';
};
const stickerSize=byId('stickerSize');
let resizing=false;
stickerSize.oninput=()=>{
  const sticker=state.stickers[state.selected];
  if(!sticker) return;
  if(!resizing){remember();resizing=true;}
  sticker.size=Number(stickerSize.value);
  render();
};
stickerSize.onchange=stickerSize.onblur=()=>{resizing=false;};
byId('removeSticker').onclick=()=>{
  if(state.selected<0) return;
  remember();
  state.stickers.splice(state.selected,1);
  state.selected=-1;
  state.pointer=null;
  render();
  byId('notice').textContent='스티커를 삭제했어요.';
};
byId('save').onclick=()=>{
  art.toBlob(blob=>{
    if(!blob){byId('notice').textContent='PNG를 만들 수 없어요.';return;}
    const link=document.createElement('a');
    link.download='moyang-emoticon.png';link.href=URL.createObjectURL(blob);
    document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(link.href),30000);
    byId('notice').textContent='PNG 다운로드를 시작했어요. ('+Math.ceil(blob.size/1024)+' KB)';
  },'image/png');
};
const customFrames=[];
const frameLimit=24;
let motionTimer=null, savingMotion=false;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function showPreview(frame){
  preview.clearRect(0,0,180,180);
  preview.drawImage(frame,0,0,180,180);
}
function canvasFrame(size=360){
  const frame=document.createElement('canvas');
  frame.width=frame.height=size;
  return frame;
}
function copyFrame(source,size=360){
  const frame=canvasFrame(size);
  frame.getContext('2d').drawImage(source,0,0,size,size);
  return frame;
}
function frameDuration(mode){
  const speed={slow:1.5,normal:1,fast:.65}[byId('speed').value];
  return Math.round((mode==='custom'?240:90)*speed);
}
function drawMotion(context,mode,index,size){
  const phase=index*2*Math.PI/12;
  let scale=.86,y=0,angle=0;
  if(mode==='bounce') y=-20*Math.abs(Math.sin(phase/2));
  if(mode==='sway') angle=.13*Math.sin(phase);
  if(mode==='pulse') scale+=.09*Math.sin(phase);
  context.save();
  context.scale(size/360,size/360);
  context.translate(180,180+y);
  context.rotate(angle);
  context.scale(scale,scale);
  context.drawImage(art,-180,-180);
  context.restore();
}
function animationPlan(){
  const mode=byId('motion').value;
  const frames=mode==='custom'?customFrames.slice():Array.from({length:12},(_,index)=>{
    const frame=canvasFrame();
    drawMotion(frame.getContext('2d'),mode,index,360);
    return frame;
  });
  return {frames,duration:frameDuration(mode)};
}
function startMotion(){
  const mode=byId('motion').value;
  const count=mode==='custom'?customFrames.length:12;
  if(count<2) return;
  let index=0;
  function tick(){
    if(mode==='custom') showPreview(customFrames[index]);
    else {
      preview.clearRect(0,0,180,180);
      drawMotion(preview,mode,index,180);
    }
    index=(index+1)%count;
  }
  tick();
  motionTimer=setInterval(tick,frameDuration(mode));
  byId('playMotion').textContent='정지';
  byId('playMotion').setAttribute('aria-pressed','true');
}
function refreshMotion(){
  const wasPlaying=motionTimer!==null;
  stopMotion();
  updateMotionControls();
  if(wasPlaying || !reducedMotion.matches) startMotion();
}
function stopMotion(){
  clearInterval(motionTimer);motionTimer=null;
  byId('playMotion').textContent='재생';
  byId('playMotion').setAttribute('aria-pressed','false');
  showPreview(art);
}
function updateMotionControls(){
  const custom=byId('motion').value==='custom';
  byId('frameControls').hidden=!custom;
  byId('frameCount').textContent=customFrames.length+' / '+frameLimit+' 장면';
  byId('addFrame').disabled=customFrames.length>=frameLimit;
  byId('removeFrame').disabled=!customFrames.length;
  const ready=!custom || customFrames.length>=2;
  byId('playMotion').disabled=!ready;
  byId('saveMotion').disabled=!ready || savingMotion;
  byId('saveGif').disabled=!ready || savingMotion;
  byId('saveVideo').disabled=!ready || savingMotion;
}
byId('motion').onchange=()=>{
  refreshMotion();
  byId('motionNotice').textContent='';
};
byId('speed').onchange=refreshMotion;
byId('addFrame').onclick=()=>{
  if(customFrames.length>=frameLimit) return;
  const frame=copyFrame(art), thumbnail=copyFrame(frame,60);
  thumbnail.setAttribute('aria-label',(customFrames.length+1)+'번째 장면');
  customFrames.push(frame);
  byId('frameList').append(thumbnail);
  refreshMotion();
};
byId('removeFrame').onclick=()=>{
  if(!customFrames.length) return;
  customFrames.pop();
  byId('frameList').lastElementChild.remove();
  refreshMotion();
};
byId('playMotion').onclick=()=>{
  if(motionTimer) stopMotion();
  else startMotion();
};

const ascii=value=>Uint8Array.from(value,char=>char.charCodeAt(0));
const fourCC=(bytes,offset)=>String.fromCharCode(...bytes.subarray(offset,offset+4));
function write24(bytes,offset,value){
  bytes[offset]=value;bytes[offset+1]=value>>>8;bytes[offset+2]=value>>>16;
}
function riffChunk(type,parts){
  const length=parts.reduce((total,part)=>total+part.byteLength,0);
  const header=new Uint8Array(8);
  header.set(ascii(type));
  new DataView(header.buffer).setUint32(4,length,true);
  return [header,...parts,new Uint8Array(length%2)];
}
async function encodeWebPFrame(frame){
  const blob=await new Promise(resolve=>frame.toBlob(resolve,'image/webp',.83));
  if(blob?.type!=='image/webp') throw new Error('WebP 인코딩을 지원하는 브라우저에서 열어 주세요.');
  const bytes=new Uint8Array(await blob.arrayBuffer());
  const view=new DataView(bytes.buffer);
  if(fourCC(bytes,0)!=='RIFF' || fourCC(bytes,8)!=='WEBP') throw new Error('프레임을 인코딩할 수 없어요.');
  const chunks=[];
  let alpha=false, hasImage=false;
  for(let offset=12;offset+8<=bytes.length;){
    const type=fourCC(bytes,offset), size=view.getUint32(offset+4,true);
    const end=offset+8+size+size%2;
    if(end>bytes.length) throw new Error('프레임 데이터가 손상되었어요.');
    if(type==='ALPH' || type==='VP8 ' || type==='VP8L') chunks.push(bytes.subarray(offset,end));
    if(type==='VP8 ' || type==='VP8L') hasImage=true;
    if(type==='ALPH' || (type==='VP8L' && size>=5 && (bytes[offset+12]&16))) alpha=true;
    offset=end;
  }
  if(!hasImage) throw new Error('프레임 이미지가 없어요.');
  return {chunks,alpha};
}
async function encodeAnimation(frames,duration){
  const frameChunks=[];
  let alpha=false;
  for(const frame of frames){
    const encoded=await encodeWebPFrame(frame);
    alpha ||= encoded.alpha;
    const header=new Uint8Array(16);
    write24(header,6,frame.width-1);
    write24(header,9,frame.height-1);
    write24(header,12,duration);
    header[15]=2;
    frameChunks.push(...riffChunk('ANMF',[header,...encoded.chunks]));
  }
  const extended=new Uint8Array(10);
  extended[0]=2|(alpha?16:0);
  write24(extended,4,frames[0].width-1);
  write24(extended,7,frames[0].height-1);
  const body=[ascii('WEBP'),...riffChunk('VP8X',[extended]),...riffChunk('ANIM',[new Uint8Array(6)]),...frameChunks];
  return new Blob(riffChunk('RIFF',body),{type:'image/webp'});
}
function gifImageData(rgba){
  const bytes=[];
  let bits=0, used=0;
  function write(code){
    bits|=code<<used; used+=9;
    while(used>=8){bytes.push(bits&255); bits>>>=8;used-=8;}
  }
  const dictionary=new Map();
  let next=258, prefix=-1;
  write(256);
  for(let i=0;i<rgba.length;i+=4){
    const color=(rgba[i]&224)|((rgba[i+1]>>>3)&28)|(rgba[i+2]>>>6);
    if(prefix<0){prefix=color;continue;}
    const key=prefix*256+color;
    const code=dictionary.get(key);
    if(code!==undefined){prefix=code;continue;}
    write(prefix);
    if(next<510) dictionary.set(key,next++);
    else{write(256);dictionary.clear();next=258;}
    prefix=color;
  }
  write(prefix);write(257);
  if(used) bytes.push(bits&255);
  const blocks=[];
  for(let i=0;i<bytes.length;i+=255){
    const block=Uint8Array.from(bytes.slice(i,i+255));
    blocks.push(Uint8Array.of(block.length),block);
  }
  return [...blocks,Uint8Array.of(0)];
}
function encodeChatGif(frames,duration){
  const width=frames[0].width,height=frames[0].height;
  const palette=new Uint8Array(768);
  for(let i=0;i<256;i++){
    palette[i*3]=Math.round((i>>>5)*255/7);
    palette[i*3+1]=Math.round(((i>>>2)&7)*255/7);
    palette[i*3+2]=(i&3)*85;
  }
  const parts=[ascii('GIF89a'),Uint8Array.of(width&255,width>>>8,height&255,height>>>8,247,255,0),palette,
    Uint8Array.of(33,255,11),ascii('NETSCAPE2.0'),Uint8Array.of(3,1,0,0,0)];
  const surface=canvasFrame(width), context=surface.getContext('2d',{willReadFrequently:true});
  const delay=Math.max(2,Math.round(duration/10));
  for(const frame of frames){
    context.fillStyle='#fff';context.fillRect(0,0,width,height);
    context.drawImage(frame,0,0);
    const rgba=context.getImageData(0,0,width,height).data;
    parts.push(Uint8Array.of(33,249,4,4,delay&255,delay>>>8,0,0));
    parts.push(Uint8Array.of(44,0,0,0,0,width&255,width>>>8,height&255,height>>>8,0,8));
    for(const block of gifImageData(rgba)) parts.push(block);
  }
  parts.push(Uint8Array.of(59));
  return new Blob(parts,{type:'image/gif'});
}
async function encodeChatVideo(frames,duration){
  const mimeType=['video/mp4;codecs=avc1.42001E','video/mp4']
    .find(type=>window.MediaRecorder?.isTypeSupported(type));
  const canvas=canvasFrame();
  if(!mimeType || !canvas.captureStream) throw new Error('이 브라우저에서는 MP4 저장을 지원하지 않아요.');
  const context=canvas.getContext('2d');
  const stream=canvas.captureStream(30);
  try{
    const recorder=new MediaRecorder(stream,{mimeType});
    const chunks=[];
    const video=new Promise((resolve,reject)=>{
      recorder.ondataavailable=event=>{if(event.data.size) chunks.push(event.data);};
      recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/mp4'}));
      recorder.onerror=()=>reject(new Error('동영상을 녹화할 수 없어요.'));
    });
    const started=performance.now();
    const length=frames.length*duration;
    const total=length*Math.max(2,Math.ceil(2700/length));
    recorder.start();
    let animation;
    function draw(now){
      const elapsed=Math.max(0,now-started);
      if(elapsed>=total){if(recorder.state!=='inactive') recorder.stop();return;}
      context.fillStyle='#fff';
      context.fillRect(0,0,360,360);
      context.drawImage(frames[Math.floor(elapsed/duration)%frames.length],0,0);
      animation=requestAnimationFrame(draw);
    }
    draw(started);
    try{
      const blob=await video;
      if(!blob.size) throw new Error('동영상 파일이 비어 있어요.');
      return blob;
    }finally{
      cancelAnimationFrame(animation);
    }
  }finally{
    stream.getTracks().forEach(track=>track.stop());
  }
}
async function saveMovingImage(format){
  if(savingMotion) return;
  const {frames,duration}=animationPlan();
  if(frames.length<2) return;
  savingMotion=true;updateMotionControls();
  const notice=byId('motionNotice');
  notice.textContent=format+' 파일을 만드는 중이에요.';
  try{
    let blob, filename;
    if(format==='GIF'){blob=encodeChatGif(frames,duration); filename='moyang-chat.gif';}
    else if(format==='MP4'){blob=await encodeChatVideo(frames,duration); filename='moyang-chat.mp4';}
    else{blob=await encodeAnimation(frames,duration); filename='moyang-animated.webp';}
    const url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url;link.download=filename;
    document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    notice.textContent=format+' 다운로드를 시작했어요. '+frames.length+'장 · '+Math.ceil(blob.size/1024)+' KB';
  }catch(error){
    notice.textContent=error.message;
  }finally{
    savingMotion=false;updateMotionControls();
  }
}
byId('saveMotion').onclick=()=>saveMovingImage('WebP');
byId('saveGif').onclick=()=>saveMovingImage('GIF');
byId('saveVideo').onclick=()=>saveMovingImage('MP4');
sample();
render();
refreshMotion();
