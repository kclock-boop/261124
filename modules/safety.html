<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현장 안전 점검 | SAFETY NOTE</title><meta name="theme-color" content="#123b35">
<style>
:root{--green:#176b52;--nav:#123b35;--ink:#192a25;--muted:#718079;--line:#e5ebe7;--bg:#f4f7f5;--mint:#e8f4ee;--red:#b74637;--amber:#9a6415}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Noto Sans KR',sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:var(--nav);padding:25px 16px;color:#eaf3ef}.brand{font-size:15px;font-weight:800;padding:5px 10px 32px}.brand i{display:inline-grid;place-items:center;background:#d9f1e4;color:#164b3d;border-radius:10px;width:34px;height:34px;margin-right:9px;font-style:normal}.brand small{display:block;color:#a9c1b7;font-size:10px;margin-left:44px;margin-top:-5px}.label{font-size:10px;color:#83a49a;padding:0 10px 9px;letter-spacing:1px}.nav{padding:12px;border-radius:8px;color:#c3d5cd;margin:3px 0;font-size:12px}.nav.on{background:#ffffff19;color:white;font-weight:700}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 34px;font-size:12px;color:var(--muted)}.top b{color:var(--ink)}.avatar{background:#e0eee7;color:var(--green);border-radius:50%;padding:8px;font-weight:bold}.main{max-width:1200px;padding:34px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.2px;color:var(--green);font-weight:700}.head h1{font-size:25px;letter-spacing:-1px;margin:5px 0}.head p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;font:600 11px inherit;cursor:pointer}.primary{background:var(--green);color:white;border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:16px}.card small{color:var(--muted);font-size:11px}.num{font-size:26px;font-weight:800;margin:7px 0 0}.toolbar{background:white;border:1px solid var(--line);border-radius:11px 11px 0 0;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:4px}.tab{border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--muted);font:600 11px inherit;cursor:pointer}.tab.on{background:var(--mint);color:var(--green)}input,select,textarea{font:12px inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px;background:white}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;background:#fbfcfb;color:#82908b;font-size:10px;font-weight:600;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #eff2f0;font-size:11px}tr:last-child td{border:0}.strong{font-size:12px;font-weight:700}.muted{color:var(--muted);font-size:10px;margin-top:3px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;font-weight:700;font-size:10px;background:#fff0ed;color:var(--red)}.progress{background:#fff5df;color:var(--amber)}.done{background:var(--mint);color:var(--green)}.thumb{width:35px;height:35px;object-fit:cover;border-radius:6px;background:#edf2ef;vertical-align:middle}.foot{display:flex;justify-content:space-between;color:#899790;font-size:10px;padding:12px 2px}.modal{display:none;position:fixed;inset:0;background:#12231f78;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:white;width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:14px}.mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700}.form{padding:20px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#52635d}.field textarea{min-height:70px;resize:vertical}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos div{border:1px dashed #cbd8d1;padding:12px;border-radius:8px;background:#fafcfb}.photos label{display:block;font-size:11px;font-weight:700;margin-bottom:8px}.preview img{width:50px;height:50px;object-fit:cover;border-radius:5px;margin:7px 5px 0 0}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{color:var(--muted);font-size:10px;margin-top:10px}.detailphotos img{width:120px;height:100px;object-fit:cover;margin:0 8px 8px 0;border-radius:7px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173d34;color:white;padding:11px 17px;border-radius:8px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:780px){.shell{grid-template-columns:58px 1fr}.side{padding:20px 8px}.brand{font-size:0;padding:0 3px 30px}.brand i{margin:0}.brand small,.label{display:none}.nav{font-size:0;text-align:center;padding:13px 2px}.nav:before{content:'•';font-size:16px}.main{padding:23px 12px}.top{padding:0 13px}.cards{grid-template-columns:repeat(2,1fr)}.head{align-items:start;gap:10px;flex-direction:column}.toolbar{align-items:start;gap:9px;flex-direction:column}.filters{display:flex;width:100%}.filters input{flex:1;min-width:0}}@media(max-width:540px){.grid,.photos{grid-template-columns:1fr}.field.full{grid-column:auto}.form{padding:15px}.head h1{font-size:22px}}
@media print{body{background:white}.side,.top,.cards,.toolbar,.foot,.actions,.head button{display:none!important}.shell{display:block}.main{padding:0}.head{margin-bottom:12px}.head h1{font-size:20px}.tablewrap{border:1px solid #bbb;border-radius:0}table{min-width:0}td,th{padding:7px;font-size:9px}}
.shell{display:block}.main{margin:auto;max-width:1450px}@media(max-width:700px){.main{padding:12px}}
</style></head><body>
<div class="shell"><section><main class="main"><div class="head"><div><h1>현장 순회 점검</h1><p>점검부터 개선 조치까지, 현장 안전 기록을 한곳에서 관리하세요.</p></div><button class="btn primary" onclick="openForm()">＋ 점검 기록 추가</button></div>
<div class="cards"><div class="card"><small>전체 점검 기록</small><div class="num" id="total">0</div></div><div class="card"><small>조치 대기</small><div class="num" id="open">0</div></div><div class="card"><small>조치 진행 중</small><div class="num" id="progress">0</div></div><div class="card"><small>조치 완료</small><div class="num" id="done">0</div></div></div>
<div class="toolbar"><div class="tabs"><button class="tab on" data-f="all">전체 기록</button><button class="tab" data-f="open">조치 대기</button><button class="tab" data-f="progress">진행 중</button><button class="tab" data-f="done">완료</button></div><div class="filters"><input id="search" placeholder="현장·위험요인 검색" oninput="render()"><select id="month" onchange="render()"><option value="all">전체 기간</option></select><button class="btn" onclick="print()">인쇄 / PDF</button></div></div>
<div class="tablewrap"><table><thead><tr><th>점검일</th><th>점검 위치</th><th>위험요인 / 조치</th><th>위험도</th><th>상태</th><th>전·후 사진</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><span>기록은 이 기기의 브라우저에 자동 저장됩니다.</span><span id="shown"></span></div></main></section></div>
<div class="modal" id="formModal"><div class="box"><div class="mhead"><span id="formTitle">새 점검 기록</span><button class="btn" onclick="closeForm()">×</button></div><form class="form" id="recordForm"><div class="grid"><div class="field"><label>점검일 *</label><input name="date" type="date" required></div><div class="field"><label>점검자</label><input name="inspector" placeholder="이름"></div><div class="field"><label>현장 / 구역 *</label><input name="area" placeholder="예: A동 2층 생산라인" required></div><div class="field"><label>위험도</label><select name="risk"><option>높음</option><option selected>보통</option><option>낮음</option></select></div><div class="field full"><label>위험요인 *</label><textarea name="hazard" placeholder="발견한 위험 상황을 구체적으로 적어주세요" required></textarea></div><div class="field full"><label>시정조치 내용</label><textarea name="action" placeholder="필요한 개선 조치 내용을 적어주세요"></textarea></div><div class="field"><label>조치 담당자</label><input name="owner" placeholder="담당자"></div><div class="field"><label>조치 기한</label><input name="due" type="date"></div><div class="field full"><label>조치 상태</label><select name="status"><option value="open">조치 대기</option><option value="progress">진행 중</option><option value="done">완료</option></select></div><div class="field full"><label>현장 사진 (조치 전 / 조치 후)</label><div class="photos"><div><label>조치 전 사진</label><input name="before" type="file" accept="image/*" multiple><div class="preview" id="prevbefore"></div></div><div><label>조치 후 사진</label><input name="after" type="file" accept="image/*" multiple><div class="preview" id="prevafter"></div></div></div></div></div><div class="notice">사진과 기록은 현재 브라우저에 저장됩니다. 브라우저 데이터를 지우면 기록이 사라질 수 있습니다.</div><div class="actions"><button type="button" class="btn" onclick="closeForm()">취소</button><button class="btn primary">기록 저장</button></div></form></div></div>
<div class="modal" id="detailModal"><div class="box"><div class="mhead">점검 기록 상세<button class="btn" onclick="closeDetail()">×</button></div><div class="form" id="detail"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='safety-note-v1';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let filter='all',editing=null,pics={before:[],after:[]};const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={open:'조치 대기',progress:'진행 중',done:'완료'};
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next))}catch{toast('브라우저 저장 공간이 부족합니다. 사진 용량을 줄여 주세요.');return false}records=next;render();return true}function render(){const months=[...new Set(records.map(r=>r.date?.slice(0,7)).filter(Boolean))].sort().reverse(),sel=$('#month'),old=sel.value;sel.innerHTML='<option value="all">전체 기간</option>'+months.map(m=>'<option>'+m+'</option>').join('');sel.value=months.includes(old)?old:'all';const q=$('#search').value.toLowerCase(),m=sel.value;const list=records.filter(r=>(filter==='all'||filter===r.status)&&(!m||m==='all'||r.date?.startsWith(m))&&(!q||[r.area,r.hazard,r.action,r.inspector,r.owner].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$('#rows').innerHTML=list.length?list.map(r=>`<tr><td>${esc(r.date)}<div class="muted">${esc(r.inspector||'점검자 미입력')}</div></td><td><div class="strong">${esc(r.area)}</div><div class="muted">${r.owner?'담당 '+esc(r.owner):'담당자 미지정'} ${r.due?'· 기한 '+esc(r.due):''}</div></td><td>${esc(r.hazard)}<div class="muted">${esc(r.action||'조치 내용 미입력')}</div></td><td style="font-weight:700;color:${r.risk==='높음'?'#b74637':r.risk==='낮음'?'#176b52':'#9a6415'}">${esc(r.risk)}</td><td><span class="badge ${r.status}">${labels[r.status]}</span></td><td>${r.before?.[0]?'<img class="thumb" title="조치 전" src="'+r.before[0]+'">':'＋'}　${r.after?.[0]?'<img class="thumb" title="조치 후" src="'+r.after[0]+'">':'＋'}</td><td><button class="btn" onclick="showDetail('${r.id}')">보기</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:35px;color:#718079">'+(records.length?'검색 결과가 없습니다.':'첫 점검 기록을 추가해보세요.')+'</td></tr>';$('#total').textContent=records.length;for(const s of ['open','progress','done'])$('#'+s).textContent=records.filter(r=>r.status===s).length;$('#shown').textContent=list.length+'건 표시'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});
function openForm(id){editing=id||null;pics={before:[],after:[]};const f=$('#recordForm');f.reset();$('#prevbefore').innerHTML='';$('#prevafter').innerHTML='';$('#formTitle').textContent=id?'점검 기록 수정':'새 점검 기록';if(id){const r=records.find(x=>x.id===id);for(const k of ['date','inspector','area','risk','hazard','action','owner','due','status'])f.elements[k].value=r[k]||'';pics.before=r.before||[];pics.after=r.after||[];preview('before');preview('after')}else{f.elements.date.value=new Date().toLocaleDateString('sv-SE');f.elements.status.value='open'}$('#formModal').classList.add('show')}function closeForm(){$('#formModal').classList.remove('show')}
function preview(k){$('#prev'+k).innerHTML=pics[k].map(x=>'<img src="'+x+'">').join('')}for(const k of ['before','after'])$('#recordForm').elements[k].onchange=async e=>{const read=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});pics[k]=pics[k].concat(await Promise.all([...e.target.files].map(read)));preview(k);e.target.value=''};
$('#recordForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,v=Object.fromEntries(['date','inspector','area','risk','hazard','action','owner','due','status'].map(k=>[k,f.elements[k].value.trim()])),old=records.find(r=>r.id===editing);const next=old?records.map(r=>r.id===editing?{...r,...v,...pics}:r):[{id:crypto.randomUUID(),...v,...pics},...records];if(!save(next))return;closeForm();toast(old?'기록을 수정했습니다.':'점검 기록을 저장했습니다.')};
function showDetail(id){const r=records.find(x=>x.id===id);$('#detail').innerHTML='<div class="grid"><div><b>'+esc(r.area)+'</b><p>'+esc(r.date)+' · '+esc(r.inspector||'점검자 미입력')+'</p><p>위험도 '+esc(r.risk)+' · 담당자 '+esc(r.owner||'-')+' · 기한 '+esc(r.due||'-')+'</p></div><div><b>위험요인</b><p>'+esc(r.hazard)+'</p></div><div><b>시정조치 내용</b><p>'+esc(r.action||'입력된 내용이 없습니다.')+'</p></div><div><b>조치 상태</b><p><select id="detailStatus"><option value="open">조치 대기</option><option value="progress">진행 중</option><option value="done">완료</option></select></p></div><div class="field full"><b>조치 전 / 후 사진</b><p class="detailphotos">'+(r.before||[]).map(x=>'<img src="'+x+'">').join('')+(r.after||[]).map(x=>'<img src="'+x+'">').join('')+'</p></div></div><div class="actions"><button class="btn" style="margin-right:auto;color:#b74637" onclick="delRecord(\''+id+'\')">삭제</button><button class="btn" onclick="closeDetail();openForm(\''+id+'\')">수정</button><button class="btn primary" onclick="setStatus(\''+id+'\')">상태 저장</button></div>';$('#detailStatus').value=r.status;$('#detailModal').classList.add('show')}function closeDetail(){$('#detailModal').classList.remove('show')}function setStatus(id){if(!save(records.map(r=>r.id===id?{...r,status:$('#detailStatus').value}:r)))return;closeDetail();toast('조치 상태를 업데이트했습니다.')}function delRecord(id){if(confirm('이 점검 기록을 삭제할까요?')){if(!save(records.filter(r=>r.id!==id)))return;closeDetail();toast('기록을 삭제했습니다.')}}let tt;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),2200)}$('#formModal').onclick=e=>{if(e.target.id==='formModal')closeForm()};$('#detailModal').onclick=e=>{if(e.target.id==='detailModal')closeDetail()};render();
</script></body></html>
